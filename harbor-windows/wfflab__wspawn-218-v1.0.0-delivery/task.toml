# wfflab__wspawn-218 -- Windows handle-inheritance sandbox launcher task.
#
# This task is Windows-specific by construction: the child process has to receive
# exactly the object handles the caller names, and on Windows that means creating
# the process with an extended STARTUPINFO carrying a handle list, because the
# default is to hand over every inheritable handle the parent owns. POSIX behaves
# the opposite way (descriptors are not inherited unless marked), so the required
# behaviour has no counterpart there. See metadata/windows_mechanism.json for the
# counterfactual, the exclusive declaration and the mechanism anchors.

version = "1.0"

# Pinned by immutable digest. The buyer's delivery self-check reads this field
# straight out of task.toml and fails with "Task has no pinned Docker image" when
# it is absent, so the pin lives here as well as in environment/Dockerfile's FROM
# line; the two must stay identical.
docker_image = "mcr.microsoft.com/windows/servercore:ltsc2022@sha256:76cf422c98ca437b308374d0498280541fa42ac7061bb44015a6c8b70cf4db6a"

[metadata]
quality_restoration_version = "20261012.1"
author_name = "wfflab"
task_id = "wfflab__wspawn-218"
tags = ["coding", "windows", "process", "handle-inheritance", "sandbox", "startupinfo", "child-process"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
os = "windows"
workdir = "C:\\testbed"

[task]
id = "wfflab__wspawn-218"
name = "wfflab/wspawn-218"
version = "1.0.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
mutable_paths = ["environment/workspace/wspawn"]
read_only_paths = [
  "instruction.md",
  "environment/prepare.ps1",
  "environment/run.ps1",
  "environment/restore.ps1",
  "environment/cleanup.ps1",
  "environment/validate_environment.ps1",
  "environment/workspace/docs",
  "environment/workspace/tests",
]
withheld_from_agent = ["tests", "solution"]
