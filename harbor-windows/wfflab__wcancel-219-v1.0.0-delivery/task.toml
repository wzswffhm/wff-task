# wfflab__wcancel-219 -- Windows overlapped-I/O cancellation task.
#
# This task is Windows-specific by construction: stopping exactly one pending
# request means cancelling by OVERLAPPED inside the kernel, and on Windows that
# entry point is CancelIoEx, which may be called from any thread and reports the
# terminal state as ERROR_OPERATION_ABORTED. The naive substitutes are the trap:
# CancelIo only covers the calling thread's requests on the handle (and returns
# success when it cancels nothing), and POSIX has no counterpart at all (aio_cancel
# and io_uring model cancellation completely differently). See
# metadata/windows_mechanism.json for the counterfactual, the exclusive
# declaration and the mechanism anchors.

version = "1.0"

# Pinned by immutable digest. The buyer's delivery self-check reads this field
# straight out of task.toml and fails with "Task has no pinned Docker image" when
# it is absent, so the pin lives here as well as in environment/Dockerfile's FROM
# line; the two must stay identical.
docker_image = "mcr.microsoft.com/windows/servercore:ltsc2022@sha256:76cf422c98ca437b308374d0498280541fa42ac7061bb44015a6c8b70cf4db6a"

[metadata]
quality_restoration_version = "20261012.1"
author_name = "wfflab"
task_id = "wfflab__wcancel-219"
tags = ["coding", "windows", "io", "overlapped-io", "asynchronous-io", "cancellation", "named-pipe"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
os = "windows"
