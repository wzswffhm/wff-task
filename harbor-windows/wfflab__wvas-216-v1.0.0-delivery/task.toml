# Platform schema version fixed by the upstream Outside Harbor contract.
version = "1.0"

# Immutable base image. environment/Dockerfile carries the same digest on its
# FROM line, so the declared and the built image cannot drift, and Standard
# Harbor reads the reference from here while it builds the Dockerfile itself.
docker_image = "mcr.microsoft.com/windows/servercore:ltsc2022@sha256:76cf422c98ca437b308374d0498280541fa42ac7061bb44015a6c8b70cf4db6a"
#
# The Windows kernel is not a delivery vehicle here: the contract under test is
# the real virtual memory API of a live process (VirtualQueryEx /
# GetMappedFileNameW / QueryDosDeviceW). metadata/windows_mechanism.json records
# the counterfactual, the exclusive declaration and the mechanism anchors.
#
# Revision 2026-10-14 (task version 1.0.0): new task. 16 required cases in 7
# programmatic groups (F2P 8 / P2P 8).

[metadata]
quality_restoration_version = "20261014.1"
author_name = "wfflab"
task_id = "wfflab__wvas-216"
tags = ["coding", "windows", "python", "virtual-memory", "address-space", "winapi", "process-audit"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
# Standard Harbor reads the OS switch and the working directory from this table.
# Harbor builds environment/Dockerfile itself, which bakes the workspace into
# C:\testbed.
os = "windows"
workdir = "C:\\testbed"

# Local runner compatibility extension. These paths are relative to the task
# root and are re-validated by the task authoring pipeline.
[task]
id = "wfflab__wvas-216"
# Standard Harbor requires "org/name" here; the local runner uses `id` above.
name = "wfflab/wvas-216"
version = "1.0.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
# The candidate may only change the package sources. The contract document stays
# read-only, and neither tests/ nor solution/ is part of the agent-visible
# surface (see environment/agent_visible_paths.json): the hidden behavioural
# suite and the reference payload are injected on the verifier side at grading
# time.
mutable_paths = ["environment/workspace/wvas"]
read_only_paths = ["instruction.md", "environment/prepare.ps1", "environment/run.ps1", "environment/restore.ps1", "environment/cleanup.ps1", "environment/validate_environment.ps1", "environment/workspace/docs", "environment/workspace/tests"]
withheld_from_agent = ["tests", "solution"]
