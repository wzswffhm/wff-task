[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsync"
version = "0.4.2"
description = "Deterministic mirror synchronisation for enterprise Windows file trees"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-json-report>=1.5"]

[tool.setuptools]
packages = ["wsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
