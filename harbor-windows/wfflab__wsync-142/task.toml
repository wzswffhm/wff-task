version = "2.1"

[metadata]
author_name = "wfflab"
tags = ["coding", "windows", "windows-bench"]

[agent]
# 规范：单次端到端评测原则上 <= 12 小时（43200s）。本题为中小规模单包修复，6 小时足够。
timeout_sec = 21600.0

[verifier]
timeout_sec = 3600.0

[environment]
# 镜像由 task-build 在构建期生成；此处声明构建后的引用名。
# 不可变身份另存于 _index/EXTERNAL_IMAGES.json 的 image_digest 字段。
docker_image = "wfflab/wsync-windows-bench:wfflab__wsync-142-v2.1"
build_timeout_sec = 3600.0
cpus = 4
memory = "8G"
storage = "20G"
