# wfflab__wtoken-221 -- Windows process-token privilege audit task.
#
# This task is Windows-specific by construction: the subject is the process
# token, its privilege list and the enabled/held distinction, which on Windows
# is expressed through a LUID-addressed privilege array on the token and is read
# and written with GetTokenInformation / AdjustTokenPrivileges. POSIX has no
# counterpart: it models authority as a user id plus supplementary groups, with
# no per-privilege record that can be present-but-switched-off, so the required
# behaviour cannot be expressed there at all. See
# metadata/windows_mechanism.json for the counterfactual, the exclusive
# declaration and the mechanism anchors.

version = "1.0"

# 成品镜像（复制工具链与 workspace 之后的结果），不是 environment/Dockerfile 的 FROM。
# 甲方主 pod 没有 Docker daemon、不允许现场构建，因此这里必须指向公共仓库里已发布的成品镜像；
# 把本字段填成官方基础镜像属于不合规（见 windows-harbor-qc/references/image-delivery-gate.md 第 1 节）。
# 构建来源：environment/Dockerfile 的 FROM mcr.microsoft.com/windows/server:ltsc2022
# （完整 Windows Server 2022，build 20348，与甲方宿主 build 一致；Nano Server/Server Core 已排除）。
# 远端身份与本次解析 digest 见 quality-review.json 的 image_delivery.resolved_image_digest。
docker_image = "ghcr.io/wzswffhm/wfflab-windows:wtoken-221-1.0.0"

[metadata]
quality_restoration_version = "20261015.1"
author_name = "wfflab"
task_id = "wfflab__wtoken-221"
tags = ["coding", "windows", "security", "token", "privileges", "audit"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
os = "windows"
workdir = "C:\\testbed"

[task]
id = "wfflab__wtoken-221"
name = "wfflab/wtoken-221"
version = "1.0.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
mutable_paths = ["environment/workspace/wtoken"]
read_only_paths = [
  "instruction.md",
  "environment/prepare.ps1",
  "environment/run.ps1",
  "environment/restore.ps1",
  "environment/cleanup.ps1",
  "environment/validate_environment.ps1",
  "environment/workspace/docs",
  "environment/workspace/tests",
]
withheld_from_agent = ["tests", "solution"]
