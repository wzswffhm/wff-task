# Platform schema version fixed by the upstream Outside Harbor contract.
version = "1.0"

# Base image pinned by immutable digest. The runtime underneath is Windows
# Server Core: the real Windows runtime whose PE image semantics and imagehlp
# checksum this contract depends on. environment/Dockerfile carries the same
# digest as its FROM line, so the declared and built images cannot drift.
#
# Revision 2026-10-13 (task version 1.1.0): v1.0.0 relied on the Dockerfile
# alone and carried no docker_image. The buyer's delivery self-check reads
# task.toml and failed with "Task has no pinned Docker image", so the pin is now
# declared here as well, exactly as wfflab__wlogseg-218 already does.
#
# Revision 2026-10-13 (task version 1.2.0): two independent programmatic groups
# were added for the PE data-directory semantics (instruction.md A2):
# data-directories and authenticode-detection. Required cases grew 27 -> 34.
#
# Revision 2026-10-13 (task version 1.3.0): instruction.md F2 adds
# signature_info(), so the Authenticode content itself must be decoded from the
# PKCS#7 SignedData DER. Group signature-decoding (0.06, 5 cases) joins the
# rubric and required cases grow 34 -> 39 (F2P 31 / P2P 8). Cases above 27 only
# trigger the buyer's manual scope review, never a block. Rationale: the 1.2.0
# round had Qwen at 3/3 x 34/34 versus Opus 2/3, so the surface had to get
# harder for the primary comparison to mean anything. Full record:
# REFIT-2026-10-13.md.
docker_image = "mcr.microsoft.com/windows/servercore:ltsc2022@sha256:76cf422c98ca437b308374d0498280541fa42ac7061bb44015a6c8b70cf4db6a"

[metadata]
quality_restoration_version = "20261011.1"
author_name = "wfflab"
task_id = "wfflab__wpeimg-219"
tags = ["coding", "windows", "python", "pe-format", "binary-parsing", "checksum", "rva"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
# Standard Harbor reads the OS switch and the working directory from this table.
# Harbor builds environment/Dockerfile itself, which bakes the workspace into
# C:\testbed.
os = "windows"
workdir = "C:\\testbed"

# Local runner compatibility extension. These paths are relative to the task
# root and are re-validated by the task authoring pipeline.
[task]
id = "wfflab__wpeimg-219"
# Standard Harbor requires "org/name" here; the local runner uses `id` above.
name = "wfflab/wpeimg-219"
version = "1.4.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
# The candidate may only change the package sources. The contract document and
# the authoritative image samples stay read-only, and neither tests/ nor
# solution/ is part of the agent-visible surface (see
# environment/agent_visible_paths.json): the hidden behavioural suite and the
# reference payload are injected on the verifier side at grading time.
mutable_paths = ["environment/workspace/wpeimg"]
read_only_paths = ["instruction.md", "environment/prepare.ps1", "environment/run.ps1", "environment/restore.ps1", "environment/cleanup.ps1", "environment/validate_environment.ps1", "environment/workspace/docs", "environment/workspace/assets", "environment/workspace/tests"]
withheld_from_agent = ["tests", "solution"]
