# wfflab__wciocp-220 -- Windows I/O completion port task.
#
# This task is Windows-specific by construction: many handles are bound to one
# completion port with their own completion keys, and the kernel hands each
# finished overlapped operation back as a packet carrying that key. Waiting
# threads draw packets from the port atomically, so a packet is delivered to
# exactly one thread. The naive substitute -- a process-local list scanned by
# every waiter -- cannot provide that: it hands the same packet to two threads or
# drops it. POSIX has no counterpart (epoll/kqueue only report readiness, and
# io_uring's completion queue is a different model with different semantics). See
# metadata/windows_mechanism.json for the counterfactual, the exclusive
# declaration and the mechanism anchors.

version = "1.0"

# Pinned by immutable digest. The buyer's delivery self-check reads this field
# straight out of task.toml and fails with "Task has no pinned Docker image" when
# it is absent, so the pin lives here as well as in environment/Dockerfile's FROM
# line; the two must stay identical.
docker_image = "mcr.microsoft.com/windows/servercore:ltsc2022@sha256:76cf422c98ca437b308374d0498280541fa42ac7061bb44015a6c8b70cf4db6a"

[metadata]
quality_restoration_version = "20261012.1"
author_name = "wfflab"
task_id = "wfflab__wciocp-220"
tags = ["coding", "windows", "io", "completion-port", "iocp", "overlapped-io", "concurrency"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
os = "windows"
workdir = "C:\\testbed"

[task]
id = "wfflab__wciocp-220"
name = "wfflab/wciocp-220"
version = "1.0.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
mutable_paths = ["environment/workspace/wciocp"]
read_only_paths = [
  "instruction.md",
  "environment/prepare.ps1",
  "environment/run.ps1",
  "environment/restore.ps1",
  "environment/cleanup.ps1",
  "environment/validate_environment.ps1",
  "environment/workspace/docs",
  "environment/workspace/tests",
]
withheld_from_agent = ["tests", "solution", "verifier"]
