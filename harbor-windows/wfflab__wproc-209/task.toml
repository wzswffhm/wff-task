# ============================================================
# 标准 Harbor Task 配置
# 目标 Schema: 1.3（若平台书面确认升级，以冻结版本为准）
#
# 身份三元组：
#   task_id    = wfflab__wproc-209
#   task_version = 1.0
#   task_hash  = d6f13ab8e16fb828bd4e203b85e327f28172ca0bdf1083fa7a145160704c82b8
# 必须与 tests/swelive_spec.json 及
# extras/metadata/manifest.json 完全一致。
#
# 任何影响 题面 / 环境 / Solution / Tests / 判分 的修改，必须升级 version
# 并重新执行受影响的验收环节。
# ============================================================

version = "1.0"

[metadata]
author_name = "wfflab"
tags = ["coding", "windows", "windows-bench"]

[agent]
# 规范：单次端到端评测原则上 <= 12 小时（43200s）。本题子进程用例含真实等待，6 小时足够。
timeout_sec = 21600.0

[verifier]
timeout_sec = 3600.0

[environment]
# 镜像由 task-build 在构建期生成；此处声明构建后的引用名。
# 不可变身份另存于 _index/EXTERNAL_IMAGES.json 的 image_digest 字段。
docker_image = "wfflab/wproc-windows-bench:wfflab__wproc-209-v1.0"
build_timeout_sec = 3600.0
cpus = 4
memory = "8G"
storage = "20G"
