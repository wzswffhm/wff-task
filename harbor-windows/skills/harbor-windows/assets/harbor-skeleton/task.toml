# ============================================================
# 标准 Harbor Task 配置骨架
# 目标 Schema: 1.3（若平台书面确认升级，以冻结版本为准）
#
# 使用说明：
#   1. 复制本文件到 <task-id>/task.toml
#   2. 替换所有 <PLACEHOLDER>
#   3. 身份三元组必须与 delivery-extras/tasks/<task-id>/metadata/manifest.json 一致
#      task_id（目录名 + instance_id） + task_version（本文件 version） + task_hash
#   4. 任何影响 题面/环境/Solution/Tests/判分 的修改，必须升级 version 并重跑受影响验收
# ============================================================

version = "1.0"

# 基础镜像必须**同时**写在这里和 environment/Dockerfile 的 FROM 里，两处逐字一致，
# 并 pin 到不可变 digest（禁止 latest）。
#
# 为什么 task.toml 也要写：随包甲方脚本把它当必需项 ——
#   run_qc.py:static_check      → 缺则 "task.toml has no docker_image"
#   inspect_delivery.py         → 缺则 "Task has no pinned Docker image"
# 两者都会把交付判 FAIL。取值示例：
#   docker_image = "mcr.microsoft.com/windows/servercore:ltsc2022@sha256:<digest>"
docker_image = "<registry>/<image>:<tag>@sha256:<digest>"

[metadata]
author_name = "<AUTHOR>"
tags = ["coding", "windows", "windows-bench"]

[agent]
# 规范：单次端到端评测原则上 <= 12 小时 (43200s)。
# 若超过 43200，必须在 delivery-extras/tasks/<task-id>/quality_review.md 说明理由。
timeout_sec = 43200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 7200.0
cpus = 8
memory = "16G"
storage = "30G"
