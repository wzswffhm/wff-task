# Platform schema version fixed by the upstream Outside Harbor contract.
version = "1.0"

# Only a locked, immutable tag. The runtime underneath is Windows Server Core,
# which is the real Windows runtime this container-format behaviour contract and
# its file-handle semantics depend on.
docker_image = "mcr.microsoft.com/windows/servercore:ltsc2022"

[metadata]
quality_restoration_version = "20260921.1"
author_name = "wfflab"
task_id = "wfflab__wchunk-216"
tags = ["coding", "windows", "python", "binary-format", "streaming", "crc", "varint"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
# Standard Harbor reads the OS switch and the working directory from this table.
# The top-level docker_image above stays authoritative for the local Outside
# Harbor runner; Harbor is deliberately left without a docker_image so it builds
# environment/Dockerfile itself (that file bakes the workspace into C:\testbed).
os = "windows"
workdir = "C:\\testbed"

# Local runner compatibility extension. These paths are relative to the task
# root and are re-validated by the task authoring pipeline.
[task]
id = "wfflab__wchunk-216"
# Standard Harbor requires "org/name" here; the local runner uses `id` above.
name = "wfflab/wchunk-216"
version = "1.0.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
# The candidate may only change the package sources. The contract document, the
# authoritative samples and everything under tests/ stay read-only.
mutable_paths = ["environment/workspace/wchunk"]
read_only_paths = ["instruction.md", "environment/prepare.ps1", "environment/run.ps1", "environment/restore.ps1", "environment/cleanup.ps1", "environment/validate_environment.ps1", "environment/workspace/docs", "environment/workspace/assets", "environment/workspace/tests", "tests"]
