# Platform schema version fixed by the upstream Outside Harbor contract.
version = "1.0"

# The base image is declared by environment/Dockerfile alone, which pins
# Windows Server Core by immutable digest: that is the real Windows runtime
# whose rounded checksum and PE image semantics this contract depends on.
# task.toml must not carry a docker_image field.

[metadata]
quality_restoration_version = "20261011.1"
author_name = "wfflab"
task_id = "wfflab__wpeimg-219"
tags = ["coding", "windows", "python", "pe-format", "binary-parsing", "checksum", "rva"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
# Standard Harbor reads the OS switch and the working directory from this table.
# Harbor builds environment/Dockerfile itself, which bakes the workspace into
# C:\testbed.
os = "windows"
workdir = "C:\\testbed"

# Local runner compatibility extension. These paths are relative to the task
# root and are re-validated by the task authoring pipeline.
[task]
id = "wfflab__wpeimg-219"
# Standard Harbor requires "org/name" here; the local runner uses `id` above.
name = "wfflab/wpeimg-219"
version = "1.0.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
# The candidate may only change the package sources. The contract document and
# the authoritative image samples stay read-only, and neither tests/ nor
# solution/ is part of the agent-visible surface (see
# environment/agent_visible_paths.json): the hidden behavioural suite and the
# reference payload are injected on the verifier side at grading time.
mutable_paths = ["environment/workspace/wpeimg"]
read_only_paths = ["instruction.md", "environment/prepare.ps1", "environment/run.ps1", "environment/restore.ps1", "environment/cleanup.ps1", "environment/validate_environment.ps1", "environment/workspace/docs", "environment/workspace/assets", "environment/workspace/tests"]
withheld_from_agent = ["tests", "solution"]
