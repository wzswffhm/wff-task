[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlogseg"
version = "0.4.0"
description = "Segmented append-only log container"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["wlogseg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
