# wfflab__wsparse-215 -- Windows/NTFS sparse pre-allocation and disk-usage task.
#
# This task is Windows-specific by construction: its acceptance criteria are the
# cluster-allocation semantics of a real NTFS volume, and the evaluator observes
# the on-disk layout through Windows system services rather than through the
# candidate's own return values. See metadata/windows_mechanism.json for the
# counterfactual, the exclusive declaration and the mechanism anchors.

version = "1.0"

# 成品镜像（复制工具链与 workspace 之后的结果），不是 environment/Dockerfile 的 FROM。
# 甲方主 pod 没有 Docker daemon、不允许现场构建，因此这里必须指向公共仓库里已发布的成品镜像；
# 把本字段填成官方基础镜像属于不合规（见 windows-harbor-qc/references/image-delivery-gate.md 第 1 节）。
# 构建来源：environment/Dockerfile 的 FROM mcr.microsoft.com/windows/server:ltsc2022
# （完整 Windows Server 2022，build 20348，与甲方宿主 build 一致；Nano Server/Server Core 已排除）。
# 远端身份与本次解析 digest 见 quality-review.json 的 image_delivery.resolved_image_digest。
docker_image = "ghcr.io/wzswffhm/wfflab-windows:wsparse-215-1.0.0"

[metadata]
quality_restoration_version = "20261012.1"
author_name = "wfflab"
task_id = "wfflab__wsparse-215"
tags = ["coding", "windows", "ntfs", "sparse-file", "deviceiocontrol", "preallocation", "disk-usage"]
difficulty = "L4"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"
os = "windows"
workdir = "C:\\testbed"

[task]
id = "wfflab__wsparse-215"
name = "wfflab/wsparse-215"
version = "1.0.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
mutable_paths = ["environment/workspace/wsparse"]
read_only_paths = [
  "instruction.md",
  "environment/prepare.ps1",
  "environment/run.ps1",
  "environment/restore.ps1",
  "environment/cleanup.ps1",
  "environment/validate_environment.ps1",
  "environment/workspace/docs",
  "environment/workspace/assets",
  "environment/workspace/tests",
]
withheld_from_agent = ["tests", "solution"]
