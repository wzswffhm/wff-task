# ============================================================
# 标准 Harbor Task 配置
# 目标 Schema: 1.3（若平台书面确认升级，以冻结版本为准）
#
# 身份三元组：
#   task_id    = wfflab__winstall-210
#   task_version = 1.0
#   task_hash  = 57c6c3638f3565bca8d2071ea24461624991f616c1b7f50c76099ab117ef160a
# 必须与 tests/swelive_spec.json 及
# extras/metadata/manifest.json 完全一致。
