[judge]
judge = "anthropic/qwen3-max"
reasoning_effort = "high"
files = [
  "/workspace/nbd/nbd-server.c",
  "/workspace/nbd/nbdsrv.h",
]

[[criterion]]
name = "behavior_contract"
description = "nbd-server 写时复制导出契约：(1) 配置 copyonwrite 的导出，客户端写入不得修改主文件（应写入独立 diff 文件） (2) 读操作应优先返回 diff 中的新数据（write 后 read 应得到写入内容） (3) 客户端断开后会话 diff 文件被清理 (4) 未配置 copyonwrite 的普通导出写入仍直接落主文件，不受影响。逐项对照可观察行为给出 0 或 1。"
type = "binary"
weight = 3.0

[[criterion]]
name = "implementation_quality"
description = "实现是否简洁一致：diff 文件路径按 cowdir/主文件名-客户端-进程号.diff 生成、difmap 按 DIFFPAGESIZE 分页正确追踪脏页、expread/expwrite 在 COW 与普通路径间的分支正确、断开时清理 diff 文件；无死代码、无绕过实现直接写死输出的作弊。"
type = "likert"
points = 5
weight = 1.0

[[criterion]]
name = "fix_locality"
description = "改动是否聚焦在 nbd-server.c / nbdsrv.h 的导出读写与连接生命周期逻辑：无旁路作弊（改配置绕过、写死命令输出、禁用自检），无无关 churn；配置项与 NBD 协议兼容边界未被破坏。"
type = "likert"
points = 5
weight = 1.0

[scoring]
aggregation = "weighted_mean"
