[judge]
judge = "openai/gpt-5.5"
files = [
  "/app/output/PLSQL-L4-001_归集存储过程_pg.sql",
  "/app/output/PLSQL-L4-001_迁移说明.md",
  "/tests/golden_output/PLSQL-L4-001_归集存储过程_pg.sql",
  "/tests/golden_output/PLSQL-L4-001_迁移说明.md",
]
mode = "individual"

[[criterion]]
id = "G1"
description = "交付物中出现凭空编造的对象：引用了 /app/input_files 提供的 schema（schema_oracle.sql / schema_pg.sql）中不存在的表、列或序列"
type = "binary"
negate = true

[[criterion]]
id = "G2"
description = "改写完全遗漏核心业务步骤：幂等清理、写 error_log、生成 settle_summary 汇总三者至少缺一"
type = "binary"
negate = true

[[criterion]]
id = "G3"
description = "改写后代码与迁移说明声称等价但存在明显破坏原逻辑的改动（如删除清理逻辑、改变 ACTIVE 条件或金额口径）"
type = "binary"
negate = true

[scoring]
aggregation = "all_pass"
