[judge]
judge = "anthropic/qwen3-max"
reasoning_effort = "high"
files = [
  "/workspace/nbd/nbd-server.c",
  "/workspace/nbd/treefiles.c",
  "/workspace/nbd/nbdsrv.c",
]

[[criterion]]
name = "behavior_contract"
description = "nbd-server treefiles 导出契约：(1) 配置 treefiles 的导出，写入的 4KiB 块应落在导出基础目录下的独立块文件（FILExxxx 按偏移路由），块文件内容与写入一致 (2) 读操作按偏移从对应块文件返回数据，未写过的块读回全零 (3) 未配置 treefiles 的普通导出读写仍走单个文件，行为不变。逐项对照可观察行为给出 0 或 1。"
type = "binary"
weight = 3.0

[[criterion]]
name = "implementation_quality"
description = "实现是否简洁一致：块路径按 construct_path 的树结构（TREEDIRSIZE/TREEPAGESIZE 层级）生成、open_treefile 写模式创建块文件 / 读模式对缺失块返回零、get_filepos 与 rawexpread/rawexpwrite 的 F_TREEFILES 分支正确、TRIM 对树块的删除语义；无死代码、无绕过实现直接写死输出的作弊。"
type = "likert"
points = 5
weight = 1.0

[[criterion]]
name = "fix_locality"
description = "改动是否聚焦在 nbd-server.c / treefiles.c / nbdsrv.c 的导出读写与文件路由逻辑：无旁路作弊（改配置绕过、写死命令输出、禁用自检），无无关 churn；普通导出与 NBD 协议兼容边界未被破坏。"
type = "likert"
points = 5
weight = 1.0

[scoring]
aggregation = "weighted_mean"
