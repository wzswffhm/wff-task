[cli]
# Points at a generated launcher (see work/larkcli_shim/) instead of lark-cli.cmd.
# Rationale: on Windows a .cmd is run through cmd.exe, which splits on '&' and
# therefore corrupts both the scene-dedup target URL and the JSON payloads the
# register script passes to `base +record-*`. The launcher calls node.exe
# directly, so arguments are delivered verbatim.
