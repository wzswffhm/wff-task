[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "larkcli-shim"
version = "1.0.0"
description = "Windows launcher that forwards to the local lark-cli without going through cmd.exe"
requires-python = ">=3.8"

[project.scripts]
lark-cli-shim = "larkcli_shim:main"

[tool.setuptools]
py-modules = ["larkcli_shim"]
