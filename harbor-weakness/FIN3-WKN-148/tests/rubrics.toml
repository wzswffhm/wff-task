[judge]
judge = "claude-code"          # 固定值，判官类型
prompt_template = "prompt.md"  # 固定值，指向同目录 prompt.md
model = "qwen3.7-plus"         # 裁判模型，照抄
timeout = 7200                 # 单个 judge 会话超时秒数
mode = "individual"            # 每条评分点独立评分
weight = 1.0                   # 固定值，照抄

# ============================ 正向：内容质量-结构与组织 ============================
[[criterion]]
id = "R01"
name = "R01"
description = "责任矩阵六格齐全：对 A、B、C 三个主体，分别就 200 万元一期出资与 800 万元二期出资给出独立分析，六个分析单元全部存在且各自有实质内容（A—200 万、A—800 万、B—200 万、B—800 万、C—200 万、C—800 万）。六格均以 A、B、C 与两笔出资对应，出现缺格、两格合并成一段处理、或把三主体笼统混写的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-148_股东未缴出资责任及被告选择诉前分析.md`."
type = "binary"
weight = 10.0

[[criterion]]
id = "R02"
name = "R02"
description = "六格要素完整度。评分为 1–5 整数，按每个分析单元（共 6 格）是否分别包含八项要素计：适用法律及时间效力、责任性质和顺位、责任/受偿上限、给付对象、成立条件、举证责任或证据缺口、主要抗辩、结论确定性。5=六格八项要素全部齐备且逐项可辨识；4=六格齐备但个别单元合并了至多 1 项要素；3=超过半数单元存在要素缺失（缺失 2 项以内）；2=多数单元缺失 3 项以上要素；1=未按单元组织要素（通篇笼统论述，无法按格核对）。 Deliverables to inspect: `/app/output/FIN3-WKN-148_股东未缴出资责任及被告选择诉前分析.md`."
type = "likert"
points = 5
weight = 7.0

# ============================ 正向：内容质量-专业规范 ============================
[[criterion]]
id = "R03"
name = "R03"
description = "200 万元届期事实认定正确：明确认定 2024 年 6 月 30 日章程出资期限届至时，B 为登记及股东名册记载的股东且逾期未缴纳；同时不得把 A 或 C 写成届期时的股东（A 已于 2024-06-20 转让、C 尚未受让）。两处认定（届期时股东为 B + 逾期未缴）须同时正确；写错届期股东身份或未指出逾期未缴的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-148_股东未缴出资责任及被告选择诉前分析.md`."
type = "binary"
weight = 7.0

