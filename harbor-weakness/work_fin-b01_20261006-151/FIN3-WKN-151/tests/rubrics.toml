[judge]
judge = "claude-code"          # 固定值，判官类型
prompt_template = "prompt.md"  # 固定值，指向同目录 prompt.md
model = "qwen3.7-plus"         # 裁判模型，照抄
timeout = 7200                 # 单个 judge 会话超时秒数
mode = "individual"            # 每条评分点独立评分
weight = 1.0                   # 固定值，照抄

# ============================ 正向：指令遵循 ============================
[[criterion]]
id = "R01"
name = "R01"
description = "交付物齐全：`/app/output/` 下存在全部 7 项必交文件——主报告 `FIN3-WKN-151_授信审批报告.md`、可复算代码 `FIN3-WKN-151_reproduce.py`、以及 `FIN3-WKN-151_charts/` 目录下 5 张复合图 PNG（`FIN3-WKN-151_chart01_材料覆盖与数据缺口.png`、`FIN3-WKN-151_chart02_财务与偿债能力.png`、`FIN3-WKN-151_chart03_现金流与营运效率.png`、`FIN3-WKN-151_chart04_额度测算与担保覆盖.png`、`FIN3-WKN-151_chart05_风险分类与授信条件.png`）。文件名须与上述逐字一致（大小写、下划线、连字符均不得改动），不得添加日期或版本号等动态成分；图表须为 PNG 格式。任一文件缺失、为空或非 PNG 即不满足。 Deliverables to inspect: `/app/output/`."
type = "binary"
weight = 3.0

# ============================ 正向：结构与组织 ============================
[[criterion]]
id = "R02"
name = "R02"
description = "报告按《template_report.md》规定的八个章节组织：一、授信结论与建议；二、材料核验与数据口径；三、客户与经营概况；四、财务状况与偿债能力分析；五、授信需求测算与额度建议；六、担保与风险缓释；七、风险分类与授信条件；八、风险提示与贷后管理要求。八章标题均可辨识（措辞可微调、可加副标题），且每章填写了实质内容而非保留模板的填写说明文字。缺章或章节为空壳的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-151_授信审批报告.md`."
type = "binary"
weight = 3.0

[[criterion]]
id = "R03"
name = "R03"
description = "全文字数在 3,000—5,000 字区间内（按中文字符计，含标点，不含 Markdown 表格竖线与代码块标记）。低于 3,000 字或高于 5,000 字均不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-151_授信审批报告.md`."
type = "binary"
weight = 3.0

# ============================ 正向：内容质量-事实忠实性 ============================
[[criterion]]
id = "R04"
name = "R04"
description = "未虚构事实或数据：报告中的公司名称、材料文件名、政策或指引名称、业务事实均可回溯到 `/app/input_files/` 中的材料；不存在材料中无法找到出处的自造事实（如虚构的客户名称、虚构的行业数据来源、虚构的诉讼事项、虚构的他行授信）。仅当发现明确的无据自造内容时判定不成立。 Deliverables to inspect: `/app/output/FIN3-WKN-151_授信审批报告.md`."
type = "binary"
weight = 3.0

[[criterion]]
id = "R05"
name = "R05"
description = "引用的源文件真实存在：报告中直接引用的 `/app/input_files/` 文件名（如《12_企业自报财务数据汇总.csv》《14_他行授信与用信明细.csv》《23_授信政策与行业限额指引.md》《24_授信额度测算指引.md》）在输入材料目录中确实存在，不存在文件名张冠李戴或引用不存在的文件。 Deliverables to inspect: `/app/output/FIN3-WKN-151_授信审批报告.md`."
type = "binary"
weight = 3.0

# ============================ 正向：内容质量-结论正确性 ============================
[[criterion]]
id = "R06"
name = "R06"
description = "核心授信结论正确：给出的建议综合授信额度为 21,000 万元（允许 ±1,000 万元，即 20,000—22,000 万元），且说明该额度低于企业申请的 30,000 万元，原因是按孰低原则取各项约束的最小值——合格担保覆盖值 21,400 万元为实际约束，向下取整至千万元后为 21,000 万元。若直接批准 30,000 万元申请、或给出与孰低测算无关的额度、或未说明额度低于申请的原因即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-151_授信审批报告.md`."
type = "binary"
weight = 10.0

[[criterion]]
id = "R07"
name = "R07"
description = "口径冲突结论正确：明确指出企业自报数据（管理口径）2025 年度营业收入 98,600 万元、净利润 8,900 万元，与经审计财务报表的 92,600 万元、8,292 万元分别相差 6,000 万元、608 万元；说明差异原因是管理口径将已发出但未取得客户验收单据的商品提前确认收入、且未考虑审计调整与资产减值；并明确本报告全部采用审计口径，管理口径不用于偿债能力与授信额度测算。仅指出差异未说明原因、或未说明取舍依据、或采用管理口径进行测算的均不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-151_授信审批报告.md`."
type = "binary"
weight = 10.0

