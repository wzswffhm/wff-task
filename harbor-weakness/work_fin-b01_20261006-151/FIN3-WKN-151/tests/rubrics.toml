# ============================ 正向：内容质量-专业规范 ============================
[[criterion]]
id = "R24"
name = "R24"
description = "授信额度测算方法论完整、参数全部取自指引：营运资金需求测算明确给出上年度经审计销售收入、销售利润率、预计增长率、营运资金周转次数四个输入及其取值依据；孰低原则逐项列出四类约束并说明取舍；所有参数均可回溯到《23_授信政策与行业限额指引.md》与《24_授信额度测算指引.md》，未引入指引之外的假设。评分锚点：5=测算链完整、参数全部可溯源、孰低取舍清晰；4=测算链基本完整、个别参数依据说明偏弱；3=缺一个关键环节（如未列集中度约束）；2=多个环节缺失但结论可循；1=无可复核的测算路径。 Deliverables to inspect: `/app/output/FIN3-WKN-151_授信审批报告.md`."
type = "likert"
points = 5
weight = 7.0

[[criterion]]
id = "R25"
name = "R25"
description = "经营与财务趋势判断有依据：对资产负债结构、盈利能力、营运能力、现金流质量四项均给出趋势判断，且每个判断都附有支撑数据或引用来源（表格、数值或材料）。评分锚点：5=四项判断齐备且均有数据支撑；4=四项齐备、个别判断缺明确支撑；3=覆盖三项或有一项仅结论无依据；2=仅覆盖两项或大量结论无依据；1=几乎未做趋势判断。 Deliverables to inspect: `/app/output/FIN3-WKN-151_授信审批报告.md`."
type = "likert"
points = 5
weight = 7.0

[[criterion]]
