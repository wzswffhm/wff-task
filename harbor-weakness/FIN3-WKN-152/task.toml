schema_version = "1.4"
# 格式： /app/output/{你的交付物名称}
artifacts = [
  "/app/output/FIN3-WKN-152_ipo_model.xlsx",
  "/app/output/FIN3-WKN-152_pricing_memo.md",
  "/app/output/FIN3-WKN-152_reproduce.py",
  "/app/output/FIN3-WKN-152_qoe_bridge.csv",
  "/app/output/FIN3-WKN-152_valuation_matrix.csv",
  "/app/output/FIN3-WKN-152_source_trace.csv",
  "/app/output/FIN3-WKN-152_charts.png",
  "/logs/artifacts/output",
]
[task]
name = "work_fin/fin3-wkn-152"
version = "3.0.0"
description = "IPO 定价委员会发行前盈利质量复核、多源勾稽与冲突处置、估值区间测算、发行结构重建与定价建议"
keywords = ["finance", "investment-banking", "A3"]
[metadata]
task_id = "FIN3-WKN-152"
author_organization = "work_fin"
category = "weakness"
domain = "金融"
domain_l2 = "投资银行"
domain_l3 = "IPO 承销与定价"
domain_l4 = "盈利质量复核与估值定价"
capabilities = "在多来源、多版本、含未复核与失效材料的 workspace 中按来源优先级取数并显式处置口径冲突、明细底表与年度数勾稽、非 GAAP 指标撤销加回后的承销口径盈利质量还原、EBITDA 为负时切换 EV/Revenue 主估值并完成 net cash bridge 与执行折扣测算、primary/secondary/greenshoe 发行结构重建与公司募集资金口径区分、股本桥与稀释交叉核验、敏感性矩阵、跨模块结果勾稽、来源追溯与定价处置建议"
difficulty = "A3"
vl_dependency = "否"
source_note = "题目来自甲方作业表（序号282，类型 weakness），场景为 IPO 承销团队在正式定价前对发行人开展盈利质量、估值区间、发行结构与数据口径复核并出具定价建议；材料按真实投行定价复核工作流的形态组织为 7 个来源目录、60 个输入文件（委员会政策含新旧两版、SEC 摘录与来源索引、财务明细底表、承销商可比公司、卖方研究、内部未复核工作稿与上一版底稿），真实场景交付物为修复后的 IPO 模型、Pricing Committee 备忘录、可复算代码、QoE 调整桥、估值敏感性矩阵、来源追溯表与复合图"
tools = "Python/Excel/Markdown/CSV/PNG"
domain_knowledge = "投资银行 IPO 定价：信息集冻结（as-of discipline）与来源优先级、口径冲突识别与显式处置、明细底表记录状态判别与年度数勾稽、盈利质量调整（管理口径 Adjusted EBITDA 撤销 SBC 加回得到承销口径 EBITDA）、非经常性项目不重复调整、非 GAAP 与 GAAP 口径差异、EBITDA 为负时的 EV/Revenue 相对估值、2024E forward revenue 分母、peer NTM EV/Revenue 区间取值与承销商自编 comps 的参考边界、net cash bridge（cash + marketable securities）、IPO execution discount、primary 与 secondary 募集归属、greenshoe（超额配售选择权）对股本与募集的影响、承销费与固定发行费用口径、post-money 股本桥与稀释 cross-check、定价委员会 Proceed/Reprice/Defer 处置规则与 QoE 风险披露"
task_complexity = "C5"
weakness_tag = ["W02-关键冲突下自行选边 / 修改输入", "W04-多要求/多交付物下缺少 Requirement Coverage Accounting", "W07-长表格/多 Sheet 下的数据覆盖与抗干扰能力弱", "W11-无据自造数据与口径", "W12-跨源交叉核对缺失"]
environment_template = "python3.12-claude2.1.114-rewardkit0.1.7"
tool_set = ["filesystem", "shell", "python"]
skill_set = []
expected_tool_dependencies = ["filesystem", "shell", "python"]
expected_skill_dependencies = []
tags = ["finance", "investment-banking", "A3", "weakness", "ipo-pricing", "equity-issuance", "relative-valuation", "multi-source-reconciliation", "llm-judge"]
[[metadata.deliverables]]
path = "FIN3-WKN-152_ipo_model.xlsx"
required = true
desc = "主交付物：修复后的 IPO 模型，含 Inputs、QoE、Valuation、Sensitivity、Offering_Proceeds、Dilution、Pricing_Summary、Error_Audit、Source_Trace 九个模块"
[[metadata.deliverables]]
path = "FIN3-WKN-152_pricing_memo.md"
required = true
desc = "Pricing Committee 备忘录，不超过 2 页，说明支持的价格区间、盈利质量风险、发行结构、数据口径处置与最终定价建议"
[[metadata.deliverables]]
path = "FIN3-WKN-152_reproduce.py"
required = true
desc = "可复算代码，从 input_files 读入原始材料并计算全部结论，不硬编码结果"
[[metadata.deliverables]]
path = "FIN3-WKN-152_qoe_bridge.csv"
required = true
desc = "盈利质量调整桥：从管理层口径到承销口径的逐项调整、金额、依据与政策条款号"
[[metadata.deliverables]]
path = "FIN3-WKN-152_valuation_matrix.csv"
required = true
desc = "估值敏感性矩阵：2024E 增长率 × EV/Revenue 倍数的每股价值，并标注 base case 与三档区间"
[[metadata.deliverables]]
path = "FIN3-WKN-152_source_trace.csv"
required = true
desc = "来源追溯表：关键指标的取值、来源、竞争值与处置结论"
[[metadata.deliverables]]
path = "FIN3-WKN-152_charts.png"
required = true
desc = "复合图：委员会支持的价格区间与拟议价位置 + 估值敏感性结果"
[agent]
timeout_sec = 72000.0
[verifier]
timeout_sec = 18000.0
user = "root"
[verifier.env]
# Judge 相关变量统一 JUDGE_ 前缀，只写在 [verifier.env]、严禁写入 [environment.env]。
# 必选项（运行环境注入，AP 必给）；可选项一律用 ${VAR:-默认值} 语法给默认值。
JUDGE_API_KEY = "${JUDGE_API_KEY:-}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-qwen3.7-plus}"
JUDGE_PROVIDER = "${JUDGE_PROVIDER:-anthropic}"
JUDGE_API_PROTOCOL = "${JUDGE_API_PROTOCOL:-anthropic}"
# 兼容旧环境的兜底注入
EVAL_API_KEY = "${EVAL_API_KEY:-}"
EVAL_API_BASE = "${EVAL_API_BASE:-}"
LITELLM_DROP_PARAMS = "true"
[environment]
os = "linux"
build_timeout_sec = 18000.0
network_mode = "public"      # claude-code 框架下不要写 no-network
cpus = 2
memory_mb = 8192
storage_mb = 30720           # 照抄
