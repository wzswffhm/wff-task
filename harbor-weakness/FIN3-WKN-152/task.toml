schema_version = "1.4"
# 格式： /app/output/{你的交付物名称}
artifacts = [
  "/app/output/FIN3-WKN-152_ipo_model.xlsx",
  "/app/output/FIN3-WKN-152_pricing_memo.md",
  "/app/output/FIN3-WKN-152_reproduce.py",
  "/logs/artifacts/output",
]
[task]
name = "work_fin/fin3-wkn-152"
version = "1.0.0"
description = "IPO 定价委员会发行前盈利质量复核、估值区间测算与定价建议"
keywords = ["finance", "investment-banking", "A1"]
[metadata]
task_id = "FIN3-WKN-152"
author_organization = "work_fin"
category = "weakness"
domain = "金融"
domain_l2 = "投资银行"
domain_l3 = "IPO 承销与定价"
domain_l4 = "盈利质量复核与估值定价"
capabilities = "按委员会控制口径的信息集冻结与来源优先级校验、非 GAAP 指标撤销加回后的承销口径盈利质量还原、EBITDA 为负时切换 EV/Revenue 主估值并完成 net cash bridge 与执行折扣测算、primary/secondary/greenshoe 发行结构重建与公司募集资金口径区分、股本桥与稀释交叉核验、跨工作表结果勾稽与定价处置建议"
difficulty = "A1"
vl_dependency = "否"
source_note = "题目来自甲方作业表（序号282，类型 weakness），场景为 IPO 承销团队在正式定价前对发行人开展盈利质量、估值区间与发行结构复核并出具定价建议；2022A/2023A 公开财务、发行条款、委员会政策、承销假设、可比公司与来源索引按题目附件重建为 8 个工作表的定价复核底稿，真实场景交付物为修复后的 IPO 模型、Pricing Committee 备忘录与可复算代码"
tools = "Python/Excel/Markdown"
domain_knowledge = "投资银行 IPO 定价：盈利质量调整（管理口径 Adjusted EBITDA 撤销 SBC 加回得到承销口径 EBITDA）、非 GAAP 指标与 GAAP 指标口径差异、EBITDA 为负时的 EV/Revenue 相对估值、2024E forward revenue 分母、peer NTM EV/Revenue 区间取值、net cash bridge（cash + marketable securities）、IPO execution discount、primary 与 secondary 募集归属、greenshoe（超额配售选择权）对股本与募集的影响、承销费与固定发行费用口径、post-money 股本桥与稀释 cross-check、定价委员会 Proceed/Reprice/Defer 处置规则与 as-of information set 纪律"
task_complexity = "C3"
weakness_tag = ["W02-关键冲突下自行选边 / 修改输入", "W07-长表格/多 Sheet 下的数据覆盖与抗干扰能力弱", "W12-跨源交叉核对缺失"]
environment_template = "python3.12-claude2.1.114-rewardkit0.1.7"
tool_set = ["filesystem", "shell", "python"]
skill_set = []
expected_tool_dependencies = ["filesystem", "shell", "python"]
expected_skill_dependencies = []
tags = ["finance", "investment-banking", "A1", "weakness", "ipo-pricing", "equity-issuance", "relative-valuation", "llm-judge"]
[[metadata.deliverables]]
path = "FIN3-WKN-152_ipo_model.xlsx"
required = true
desc = "主交付物：修复后的 IPO 模型，含 Inputs、QoE、Valuation、Offering_Proceeds、Dilution、Pricing_Summary、Error_Audit 七个模块"
[[metadata.deliverables]]
path = "FIN3-WKN-152_pricing_memo.md"
required = true
desc = "Pricing Committee 备忘录，不超过 2 页，说明支持的价格区间、盈利质量风险、发行结构与最终定价建议"
[[metadata.deliverables]]
path = "FIN3-WKN-152_reproduce.py"
required = true
desc = "可复算代码，从 Q7_题目.xlsx 读入原始材料并计算全部结论，不硬编码结果"
[agent]
timeout_sec = 72000.0
[verifier]
timeout_sec = 18000.0
user = "root"
[verifier.env]
# Judge 相关变量统一 JUDGE_ 前缀，只写在 [verifier.env]、严禁写入 [environment.env]。
# 必选项（运行环境注入，AP 必给）；可选项一律用 ${VAR:-默认值} 语法给默认值。
JUDGE_API_KEY = "${JUDGE_API_KEY:-}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-qwen3.7-plus}"
JUDGE_PROVIDER = "${JUDGE_PROVIDER:-anthropic}"
JUDGE_API_PROTOCOL = "${JUDGE_API_PROTOCOL:-anthropic}"
# 兼容旧环境的兜底注入
EVAL_API_KEY = "${EVAL_API_KEY:-}"
EVAL_API_BASE = "${EVAL_API_BASE:-}"
LITELLM_DROP_PARAMS = "true"
[environment]
os = "linux"
build_timeout_sec = 18000.0
network_mode = "public"      # claude-code 框架下不要写 no-network
cpus = 2
memory_mb = 8192
storage_mb = 30720           # 照抄
