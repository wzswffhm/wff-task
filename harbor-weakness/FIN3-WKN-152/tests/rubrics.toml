[judge]
judge = "claude-code"          # 固定值，判官类型
prompt_template = "prompt.md"  # 固定值，指向同目录 prompt.md
model = "qwen3.7-plus"         # 裁判模型，照抄
timeout = 7200                 # 单个 judge 会话超时秒数
mode = "individual"            # 每条评分点独立评分
weight = 1.0                   # 固定值，照抄

# ============================ 正向：指令遵循 ============================
[[criterion]]
id = "R01"
name = "R01"
description = "交付物齐全：`/app/output/` 下存在全部 3 项必交文件——`FIN3-WKN-152_ipo_model.xlsx`、`FIN3-WKN-152_pricing_memo.md`、`FIN3-WKN-152_reproduce.py`。文件名须与上述逐字一致（大小写、下划线、连字符均不得改动），不得添加日期、版本号等动态成分；模型须为可打开的 `.xlsx`。任一文件缺失或为空即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`, `/app/output/FIN3-WKN-152_pricing_memo.md`, `/app/output/FIN3-WKN-152_reproduce.py`."
type = "binary"
weight = 3.0

[[criterion]]
id = "R02"
name = "R02"
description = "Pricing Committee 备忘录篇幅不超过 2 页：按 A4 排版估算，`FIN3-WKN-152_pricing_memo.md` 正文中文字符不超过 1,600 个（按中文字符计，含标点，不含 Markdown 表格竖线与代码块标记）。低于等于 1,600 字为满足，超过即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_pricing_memo.md`."
type = "binary"
weight = 3.0

# ============================ 正向：内容质量-结论正确性 ============================
[[criterion]]
id = "R03"
name = "R03"
description = "核心定价建议正确：明确给出 **Proceed at $34** 的处置结论（即按拟议 $34 继续推进），并同时说明该建议以披露盈利质量风险为前提——承销口径 EBITDA 与 2023 年 FCF 均为负，不得仅因管理层 Adjusted EBITDA 改善而上调价格。若给出 Reprice 或 Defer、或未给出明确处置结论、或未披露负 QoE 前提即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_pricing_memo.md`, `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 10.0

[[criterion]]
id = "R04"
name = "R04"
description = "委员会支持价格区间正确：给出的价格区间约为 **$31.27 – $37.25**（各端点允许 ±$0.10），midpoint 约为 **$34.26**（允许 ±$0.10）；并明确指出拟议 $34 位于该区间之内、距 midpoint 约 **$0.26**（允许 ±$0.05）且未超过 $0.50 护栏。区间端点偏差超过 ±$0.10、或未说明拟议价位于区间内、或未给出距 midpoint 的距离即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_pricing_memo.md`, `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 10.0

# ============================ 正向：内容质量-数值与计算准确性 ============================
[[criterion]]
id = "R05"
name = "R05"
description = "2023 年核心财务取数正确：Revenue **804.029mm**、Net income (loss) **-90.824mm**、管理层口径 Adjusted EBITDA **-69.275mm**、SBC 及相关税费 **49.086mm**、Free Cash Flow **-84.838mm**（各允许 ±0.05mm）。任一项偏差超过容差即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R06"
name = "R06"
description = "承销口径盈利质量计算正确：按委员会政策撤销 SBC 加回后，承销口径 Underwriting EBITDA 约为 **-118.361mm**（允许 ±0.5mm），即由管理层 Adjusted EBITDA -69.275mm 减去 49.086mm 得到；并据此判断调整后 EBITDA **仍为负**。若直接沿用 -69.275mm、或采用加回后的正数、或未判断正负即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R07"
name = "R07"
description = "2024E Revenue 计算正确：按 2023A Revenue 804.029mm × (1 + 22%) 计算，约为 **980.915mm**（允许 ±1mm），并说明 22% 为委员会内部预测假设而非 SEC 公开事实。若沿用 2023 年收入 804.029mm 作为估值分母、或结果偏差超过 ±1mm、或把 22% 标注为 SEC 公开数据即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R08"
name = "R08"
description = "三档估值结果正确：在 EV/2024E Revenue 口径下，Low 4.0x 对应每股约 **$31.27**、Mid 4.5x 对应约 **$34.26**、High 5.0x 对应约 **$37.25**（各允许 ±$0.10）；计算须体现 Enterprise Value = 倍数 × 2024E Revenue，pre-money Equity = EV + cash 401.176mm + marketable securities 811.946mm，每股 = Equity ÷ 143.716563mm，再统一应用 12.5% IPO 执行折扣。任一档位偏差超过 ±$0.10，或未加回有价证券，或未应用执行折扣即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R09"
name = "R09"
description = "公司 primary 募集总额正确：按 15.276527m primary shares × $34 计算，Base company gross primary proceeds 约为 **519.402mm**（允许 ±0.5mm）。若把 secondary 的 6.723473m 一并计入公司募集、或未乘以拟议价格、或偏差超过 ±0.5mm 即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R10"
name = "R10"
description = "公司净募集额正确：在 gross primary proceeds 基础上扣除 5% 承销费（约 25.970mm）与 7.0mm 固定公司费用后，Base company net primary proceeds 约为 **486.432mm**（允许 ±0.5mm）。若未扣固定费用、或按全部发行股份计提承销费、或偏差超过 ±0.5mm 即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R11"
name = "R11"
description = "股本桥正确：Base post-money shares = 143.716563m + 15.276527m = **158.993090m**（允许 ±0.005m），**不得把 secondary 6.723473m 计入总股数**；并给出 full greenshoe exercise 后为 **162.293090m**（允许 ±0.005m）。若把 secondary 加进总股数、或漏计新增 primary、或 full exercise 情景数值错误即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

# ============================ 正向：内容质量-专业规范 ============================
[[criterion]]
id = "R12"
name = "R12"
description = "SBC 处理符合承销口径：明确依据 `Committee_Policy`，将 49.086mm SBC 视为**持续性经济成本**，在承销口径下**撤销该加回**，不得保留管理层的 SBC 加回；同时说明 2023 年重组费用 8.098mm 虽属非经常性但已包含在管理层指标中，**不再重复加回**。若仍保留 SBC 加回、或对重组费用重复加回即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 10.0

[[criterion]]
id = "R13"
name = "R13"
description = "估值方法选择正确：说明因承销口径 EBITDA 仍为负，主估值采用 **EV / 2024E Revenue**，而不是 EV/EBITDA；若使用了正数 EV/EBITDA、或未说明方法切换依据即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R14"
name = "R14"
description = "净现金桥完整：pre-money equity bridge **同时计入** cash 401.176mm 与 marketable securities 811.946mm（合计 1,213.122mm，允许 ±0.5mm）。仅使用 cash 而遗漏有价证券即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R15"
name = "R15"
description = "primary 与 secondary 口径区分正确：Base 中 primary 为 15.276527m、secondary 为 6.723473m；**secondary 不形成公司募集资金**（公司取得 secondary proceeds = 0，出售股东取得约 228.598mm），**也不增加公司总股数**。若把 secondary 计入公司募集、或计入总股数、或未区分两类股份即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R16"
name = "R16"
description = "greenshoe 处理正确：3.3m greenshoe **不进入 Base**（Base 排除 exercise），另以独立的 full-exercise 情景列示；full exercise 后 post-money shares 约 162.293090m，增量净募集资金约为 **106.590mm**（允许 ±1mm，即 3.3m × $34 × (1 − 5%)）。若把 greenshoe 预先并入 Base、或未单列 full-exercise 情景、或增量净募集对 7.0mm 固定费用重复扣减即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R17"
name = "R17"
description = "费用结构处理正确：承销费按**公司 primary gross proceeds** 的 5% 计提（约 25.970mm），固定公司费用为 7.0mm；**不得按 primary + secondary 全部股份计提承销费**；greenshoe 增量只扣 5% fee、不重复扣 7.0mm 固定费用。若费用计提基数错误或固定费用重复计提即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

# ============================ 正向：内容质量-事实忠实性与论证 ============================
[[criterion]]
id = "R18"
name = "R18"
description = "SEC 公开事实与内部 Committee 假设明确区分：说明信息集冻结于 2024-03-20，2022A/2023A 财务、发行股数、每股定价区间等来自截止日前 SEC 材料；而 22% 收入增长、peer 4.0x–5.0x 倍数区间、12.5% 执行折扣、内部 cap-table snapshot 与拟议 $34 均为**内部工作假设**，不得包装为 SEC 公开事实。若把内部假设表述为公开披露事实、或未作区分即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_pricing_memo.md`, `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R19"
name = "R19"
description = "错误识别与修正达到要求：在模型的 `Error_Audit` 模块（或等价的错误审计记录）中，识别并给出正确处理的问题**不少于 5 类**，且至少覆盖以下类别中的 5 项——SBC 加回处理、以 2023 年收入作估值分母、遗漏 IPO 执行折扣、遗漏 marketable securities、primary/secondary 混同、greenshoe 提前进入 Base、secondary 错误增加股本、使用截止日后信息。每类须同时给出 legacy 处理与正确处理；只罗列问题名称而无正确处理的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R20"
name = "R20"
description = "各模块核心结果可相互勾稽、前后自洽：盈利质量（QoE）、估值（Valuation）、募集（Offering_Proceeds）、股本与稀释（Dilution）与最终定价摘要（Pricing_Summary）中的同一指标在不同模块取值一致，计算链可逐级复核（收入 → 承销 EBITDA → 估值分母 → 企业价值 → 股权价值 → 每股价格 → 处置结论），不出现相互矛盾的数值或口径。评分锚点：5=五个模块数值完全一致、计算链可逐级复核且无任何前后矛盾；4=五个模块数值一致，其中至多 1 项非关键指标的表述未写明取值来源但结论不受影响；3=存在 1 处数值或口径不一致但不改变最终定价结论；2=存在 2 处及以上不一致，或 5 个模块中至少 2 个缺少可复核的计算过程；1=各模块数值互相矛盾、无法形成自洽的计算链。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "likert"
points = 5
weight = 7.0

[[criterion]]
id = "R21"
name = "R21"
description = "稀释交叉验算正确：利用截止日前 SEC 材料的独立口径进行 cross-check，给出在假设 $32.50/股 下 preliminary NTBV/share 约 **$11.17**、即时稀释约 **$21.33**（各允许 ±$0.10），并说明该数据仅作执行侧交叉验算、不参与 Base 定价。若未做该交叉验算、或数值明显错误、或把该数据当作定价依据即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
type = "binary"
weight = 3.0

# ============================ 正向：操作与交付安全 ============================
[[criterion]]
id = "R22"
name = "R22"
description = "可复算代码可独立运行且不硬编码结论：`FIN3-WKN-152_reproduce.py` 从 `/app/input_files/Q7_题目.xlsx` 读入原始材料后计算出各项结论数值，而非在代码中直接写入 -118.361、980.915、31.27、486.432、158.993090、34.26 等结果常量；脚本须能被 `python3 FIN3-WKN-152_reproduce.py` 直接执行并输出盈利质量、估值区间、募集、稀释与定价建议等关键结果。判官应实际读取该脚本，检查是否存在把结论数值写死在常量或字符串中的情况；从输入文件路径读取与引用输入中的原始参数（如倍数、股数、增长率）属正常，把计算所得结论硬编码即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-152_reproduce.py`."
type = "binary"
weight = 3.0

# ============================ 正向：安全合规 ============================
[[criterion]]
id = "R23"
name = "R23"
description = "未修改输入材料：`/app/input_files/Q7_题目.xlsx` 的内容与交付前的原始内容一致（仍可正常打开、8 个工作表齐全、各表关键数值与来源标注未被改动），且无新增、删除或改写输入文件的行为。仅当发现输入材料被修改、被删除或被新增文件时判定不成立。 Deliverables to inspect: `/app/input_files/Q7_题目.xlsx`."
type = "binary"
weight = 3.0

# ============================ 正向：超预期贡献 ============================
[[criterion]]
id = "R24"
name = "R24"
description = "超出最低要求的增量贡献：在规定交付物之外提供了有实质价值的补充，例如输入数据抽取对照表、估值敏感性或情景分析（倍数×增长率矩阵）、发行结构的多情景对比表、可复用的中间结果数据文件、对输入材料自身疏漏的指出与说明等。评分锚点：5=有两项以上有实质价值的增量贡献且均可独立核验；4=有一项较完整的增量贡献；3=有零散增量内容但不成体系；2=仅重复规定内容、无实质增量；1=无任何增量。 Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`, `/app/output/FIN3-WKN-152_pricing_memo.md`."
type = "likert"
points = 5
weight = 3.0

# ============================ 负向（设计态负分，落为本文件 negate 形式） ============================
[[criterion]]
id = "N01"
name = "N01"
description = "使用截止日后信息反推 Base（hindsight bias）：分析中出现 2024-03-20 之后才可获得的信息，例如最终发行价格、发行完成后的 SEC 文件、上市后交易表现，或据此反推 Base case 与定价结论；把拟议 $34 表述为已实现的最终发行结果也属该情形。仅当发现明确证据证明存在该情形时判定成立；全程只用截止日前信息与内部假设的判定不成立。（设计态负分 −10；落到 tests/rubrics.toml 时写为 negate = true + 正 weight，Reward Kit 归一化后自动翻转计分） Deliverables to inspect: `/app/output/FIN3-WKN-152_pricing_memo.md`, `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
negate = true
type = "binary"
weight = 10.0

[[criterion]]
id = "N02"
name = "N02"
description = "沿用旧底稿的错误口径而未修正：模型或备忘录中仍保留 `Candidate_Model` 的 legacy 处理，例如仍以管理层 Adjusted EBITDA -69.275mm 作为盈利质量结论、以 2023 年收入作估值分母、遗漏 12.5% 执行折扣、遗漏 marketable securities、或给出主要依据 peer high case 上调价格的建议。仅当发现明确证据证明存在该情形时判定成立；上述各项均已修正的判定不成立。（设计态负分 −7；落到 tests/rubrics.toml 时写为 negate = true + 正 weight） Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`, `/app/output/FIN3-WKN-152_pricing_memo.md`."
negate = true
type = "binary"
weight = 7.0

[[criterion]]
id = "N03"
name = "N03"
description = "发行结构口径混淆：把 secondary 的 6.723473m 计入公司募集资金、或计入公司总股数；或把 3.3m greenshoe 预先并入 Base 情景；或对 greenshoe 增量重复扣减 7.0mm 固定费用。仅当发现明确证据证明存在上述任一情形时判定成立；三类口径均正确处理的判定不成立。（设计态负分 −7；落到 tests/rubrics.toml 时写为 negate = true + 正 weight） Deliverables to inspect: `/app/output/FIN3-WKN-152_ipo_model.xlsx`."
negate = true
type = "binary"
weight = 7.0

[scoring]
aggregation = "weighted_mean"
