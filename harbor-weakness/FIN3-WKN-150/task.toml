schema_version = "1.4"
# 格式： /app/output/{你的交付物名称}
artifacts = [
  "/app/output/FIN3-WKN-150_PreIPO投资决策备忘录.md",
  "/app/output/FIN3-WKN-150_reproduce.py",
  "/app/output/FIN3-WKN-150_charts/FIN3-WKN-150_chart01_材料覆盖与数据缺口.png",
  "/app/output/FIN3-WKN-150_charts/FIN3-WKN-150_chart02_收入与利润口径还原.png",
  "/app/output/FIN3-WKN-150_charts/FIN3-WKN-150_chart03_现金流与营运效率.png",
  "/app/output/FIN3-WKN-150_charts/FIN3-WKN-150_chart04_可比与DCF估值.png",
  "/app/output/FIN3-WKN-150_charts/FIN3-WKN-150_chart05_估值区间与风险缺口.png",
  "/logs/artifacts/output",
]
[task]
name = "work_fin/fin3-wkn-150"
version = "1.0.4"
description = "拟上市公司 Pre-IPO 股权投资尽调与估值定价分析"
keywords = ["finance", "office", "A1"]
[metadata]
task_id = "FIN3-WKN-150"
author_organization = "work_fin"
category = "weakness"
domain = "金融"
domain_l2 = "私募股权投资"
domain_l3 = "Pre-IPO 投资定价"
domain_l4 = "财务尽调与估值建模"
capabilities = "多材料覆盖核对与口径冲突处理、跨源数据清洗与交叉核对、非经常性损益与股份支付口径还原、经营质量与现金流质量分析、DCF 现金流预测与折现率（CAPM/WACC）计算、可比公司筛选与倍数估值、流动性折价处理、估值区间定价与投资回报测算"
difficulty = "A1"
vl_dependency = "否"
source_note = "自出高难度题（非甲方作业表）。场景为私募股权基金对拟上市公司的 Pre-IPO 投资尽调与估值定价；公司财务数据、可比公司数据与交易条款均按真实业务逻辑重建为尽调材料包（40 份文件），真实场景交付物为投资决策备忘录、可复算代码与配套图表"
tools = "Python/Excel/CSV/Markdown"
domain_knowledge = "财务尽调与估值：报告期口径还原（非经常性损益、股份支付、调整后 EBITDA）、经营质量指标（毛利率/费用率/净现比/周转天数）、DCF（预测期自由现金流、CAPM 杠杆化 Beta、WACC、Gordon 终值、净负债口径）、市场法（可比公司筛选、倍数中位数、流动性折价）、Pre-IPO 交易定价（持股比例、业绩承诺隐含倍数、退出回报测算）"
task_complexity = "C5"
weakness_tag = ["W10-大 Workspace 下缺少 Coverage Accounting", "W04-多要求/多交付物下缺少 Requirement Coverage Accounting", "W07-长表格/多 Sheet 下的数据覆盖与抗干扰能力弱", "W11-无据自造数据与口径", "W12-跨源交叉核对缺失", "W02-关键冲突下自行选边 / 修改输入"]
environment_template = "python3.12-claude2.1.114-rewardkit0.1.7"
tool_set = ["filesystem", "shell", "python"]
skill_set = []
expected_tool_dependencies = ["filesystem", "shell", "python"]
expected_skill_dependencies = []
tags = ["finance", "office", "A1", "weakness", "pre-ipo", "valuation", "financial-due-diligence", "llm-judge"]
[[metadata.deliverables]]
path = "FIN3-WKN-150_PreIPO投资决策备忘录.md"
required = true
desc = "主交付物：Pre-IPO 投资决策备忘录，按模板八个章节填写"
[[metadata.deliverables]]
path = "FIN3-WKN-150_reproduce.py"
required = true
desc = "可复算代码，从 input_files 原始材料读入、不硬编码结果"
[[metadata.deliverables]]
path = "FIN3-WKN-150_charts/FIN3-WKN-150_chart01_材料覆盖与数据缺口.png"
required = true
desc = "复合图（a）：材料覆盖分布与核验标记"
[[metadata.deliverables]]
path = "FIN3-WKN-150_charts/FIN3-WKN-150_chart02_收入与利润口径还原.png"
required = true
desc = "复合图（a）收入与毛利率 /（b）净利润到扣非归母到调整后 EBITDA 的还原桥"
[[metadata.deliverables]]
path = "FIN3-WKN-150_charts/FIN3-WKN-150_chart03_现金流与营运效率.png"
required = true
desc = "复合图（a）净利润、经营现金流与净现比 /（b）应收与存货周转天数"
[[metadata.deliverables]]
path = "FIN3-WKN-150_charts/FIN3-WKN-150_chart04_可比与DCF估值.png"
required = true
desc = "复合图（a）PE /（b）PS /（c）EV/EBITDA 与中位数 /（d）DCF 预测期自由现金流与现值"
[[metadata.deliverables]]
path = "FIN3-WKN-150_charts/FIN3-WKN-150_chart05_估值区间与风险缺口.png"
required = true
desc = "复合图（a）DCF 敏感性 /（b）估值结果对比与区间 /（c）风险与尽调缺口评级"
[agent]
timeout_sec = 72000.0
[verifier]
timeout_sec = 18000.0
user = "root"
[verifier.env]
# Judge 相关变量统一 JUDGE_ 前缀，只写在 [verifier.env]、严禁写入 [environment.env]。
# 必选项（运行环境注入，AP 必给）；可选项一律用 ${VAR:-默认值} 语法给默认值。
JUDGE_API_KEY = "${JUDGE_API_KEY:-}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-qwen3.7-plus}"
JUDGE_PROVIDER = "${JUDGE_PROVIDER:-anthropic}"
JUDGE_API_PROTOCOL = "${JUDGE_API_PROTOCOL:-anthropic}"
# 兼容旧环境的兜底注入
EVAL_API_KEY = "${EVAL_API_KEY:-}"
EVAL_API_BASE = "${EVAL_API_BASE:-}"
LITELLM_DROP_PARAMS = "true"
[environment]
os = "linux"
build_timeout_sec = 18000.0
network_mode = "public"      # claude-code 框架下不要写 no-network
cpus = 2
memory_mb = 8192
storage_mb = 30720           # 照抄
