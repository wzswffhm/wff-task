type = "binary"
weight = 3.0
description = """工作簿模块齐备：`FIN3-WKN-153_quarterly_workbook.xlsx` 至少含八个可辨识工作表，分别对应 Coverage（材料清点与逐账户覆盖）、Holdings_Summary（券种与账户市值）、Valuation_Recalc（净值推导链）、Nav_Bridge（现金与口径调整勾稽）、Compliance_Check（五项限额）、Issue_Log（问题台账）、Task_Status（任务状态）、Prev_Report_Fix（上期重述），且各表填有实质内容。缺任一模块、或某表仅有表头无数据，即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_quarterly_workbook.xlsx."""

[[criterion]]
id = "R27"
name = "R27"
type = "binary"
weight = 3.0
description = """关键数值标注来源：工作簿或报告中为至少 5 项关键数值标注来源文件路径（如有效持仓市值来自 `/app/input_files/portfolio/holdings_2026Q3.xlsx` 与行情重推件、现金来自 `/app/input_files/valuation/nav_report_20260930.csv`、应收应付来自 `/app/input_files/valuation/accruals_20260930.csv`、限额来自 `/app/input_files/rules/restrictions_v3_20260901.md`、份额来自 `/app/input_files/valuation/nav_report_20260930.csv`），标注为来源清单或在数值旁注明。来源标注少于 5 项、或关键数值均无出处，即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_quarterly_workbook.xlsx, /app/output/FIN3-WKN-153_operation_report.md."""

[[criterion]]
id = "R28"
name = "R28"
type = "binary"
weight = 3.0
description = """报告正文含超限披露：`FIN3-WKN-153_operation_report.md` 第四节在正文（非仅工作簿）中披露 R-01 超限事实，含证券代码与名称、占比、超过的限额、成因、整改动作与时限、披露要求；仅在表格中给出比例而正文无披露段落，即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_operation_report.md."""

[[criterion]]
id = "R29"
name = "R29"
type = "binary"
weight = 3.0
description = """现金类资产比例交叉核对：交付物同时引用 `/app/input_files/rules/restrictions_v3_20260901.md` 第 7 条（不低于 3%）与 `/app/input_files/rules/liquidity_policy.md` 第 12 条（不低于 3%）对现金类资产比例 **3.40%** 作出判定，说明两处条文口径一致且本期合规；只引用其中一处、或未给出两处条文的交叉核对结论，即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_quarterly_workbook.xlsx, /app/output/FIN3-WKN-153_operation_report.md."""

[[criterion]]
id = "R30"
name = "R30"
type = "binary"
weight = 3.0
description = """信息集与关键时点正确：交付物注明报告期末 **2026-09-30**、材料截止时点 **2026-10-08**、编制日期，并说明结论仅基于截止时点前形成的材料，未使用截止时点之后的行情、整改结果或四季度数据反推本期结论。缺任一时点、或出现截止时点之后的信息用于推导，即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_operation_report.md, /app/output/FIN3-WKN-153_quarterly_workbook.xlsx."""

[[criterion]]
id = "N01"
name = "N01"
type = "binary"
negate = true
weight = 7.0
description = """伪完成或占位数据：市值、净值、比例等结论由占位符、估计值、上期数或未经输入材料计算的数值拼凑而成；或在行情不可用、字段关联失败等阻塞尚未解除的情况下宣称复核已完成。仅当发现明确证据证明存在该情形时判定成立；全部结论均由输入材料计算得出且阻塞处置留痕完整的判定不成立。 Deliverables to inspect: /app/output/FIN3-WKN-153_quarterly_workbook.xlsx, /app/output/FIN3-WKN-153_operation_report.md, /app/output/FIN3-WKN-153_reproduce.py."""

[[criterion]]
id = "N02"
name = "N02"
type = "binary"
negate = true
weight = 7.0
description = """沿用失效口径：以历史 v2 条款的 12% / 8% / 2% / 25% 阈值判定本期投资监督结论；或按未执行口径过滤的原始记录全表合计出具市值与净值结论（如采用单位净值 1.1240）；或把 2026-09-29 的行情记录计入估值日市值。仅当发现明确证据证明存在上述任一情形时判定成立；三项均按现行口径处理的判定不成立。 Deliverables to inspect: /app/output/FIN3-WKN-153_quarterly_workbook.xlsx, /app/output/FIN3-WKN-153_operation_report.md."""

[[criterion]]
id = "N03"
name = "N03"
type = "binary"
negate = true
weight = 7.0
description = """编造数据或修改输入材料：交付物中出现输入材料内无法回溯且未标注待核实的数值；或对 `/app/input_files/` 下的文件进行了修改、删除、重命名或新增（含把派生结果写回输入目录）。仅当发现明确证据时判定成立；输入目录保持原状且数值可回溯的判定不成立。 Deliverables to inspect: /logs/artifacts/output, /app/input_files, /app/output/FIN3-WKN-153_operation_report.md."""

[[criterion]]
id = "N04"
name = "N04"
type = "binary"
negate = true
weight = 3.0
description = """使用材料截止时点之后的信息：交付物引入 2026-10-08 之后形成的行情、整改完成结果、四季度数据或任何后续事实用于推导本期结论。仅当发现明确证据证明存在该情形时判定成立；仅使用截止时点前材料的判定不成立。 Deliverables to inspect: /app/output/FIN3-WKN-153_operation_report.md, /app/output/FIN3-WKN-153_quarterly_workbook.xlsx."""
