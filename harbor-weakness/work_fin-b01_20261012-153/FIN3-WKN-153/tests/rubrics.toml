[judge]
judge = "claude-code"          # 固定值，判官类型
prompt_template = "prompt.md"  # 固定值，指向同目录 prompt.md
model = "qwen3.7-plus"         # 裁判模型，照抄
timeout = 7200                 # 单个 judge 会话超时秒数
mode = "individual"            # 每条评分点独立评分
weight = 1.0                   # 固定值，照抄

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "R01"
name = "R01"
type = "binary"
weight = 10.0
description = """有效持仓口径执行正确：`FIN3-WKN-153_holdings_coverage.csv` 与 `FIN3-WKN-153_quarterly_workbook.xlsx` 的 `Coverage` 表给出持仓原始记录 **295 行**，并**分三行列出**剔除项——重复上报 **4 行**、数据所属日期非估值日 **6 行**、证券主数据状态非 active **5 行**，得到有效记录 **280 行**（295 - 4 - 6 - 5 = 280），且三类剔除对市值的影响分别为 **11,554,917.40 元**、**25,774,234.50 元**、**25,142,250.00 元**（各允许 ±1%）。三类剔除合并成一行、任一行数与上述不符、未给出有效记录 280 行、或未给出三类剔除的市值影响，即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_holdings_coverage.csv, /app/output/FIN3-WKN-153_quarterly_workbook.xlsx."""

[[criterion]]
id = "R02"
name = "R02"
type = "binary"
weight = 10.0
description = """净值推导链逐行列出且数值正确：`FIN3-WKN-153_quarterly_workbook.xlsx` 的 `Valuation_Recalc` 表（或报告第二节）**分六行**写出推导链且每行带列报值——①有效持仓市值 **1,295,353,746.36**（±0.02%）；②现金及清算备付金 **45,645,475.03**；③应收 **4,278,200.00**；④应付 **2,763,450.00**；⑤资产净值 = ①+②+③-④ = **1,342,513,971.39**（±100,000）；⑥资产净值 ÷ 总份额 **1,250,000,000.00** = 单位净值 **1.0740**。任一行缺失、未带列报值、把多步合并成一句、或结果超出各自容差，即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_quarterly_workbook.xlsx, /app/output/FIN3-WKN-153_operation_report.md."""

[[criterion]]
id = "R03"
name = "R03"
type = "binary"
weight = 10.0
description = """投资监督五项限额逐条执行正确：`Compliance_Check` 表**五行分列**给出 R-01 单一证券集中度、R-02 单一发行人集中度、R-03 非标资产比例、R-05 现金类资产比例、R-07 权益型基金比例，每行含条款号、测算值、限额数值、比较方向与结论，且结论为 **R-01 超限**、R-02 / R-03 / R-05 / R-07 四项合规。缺任一指标行、五行合并、R-01 未判为超限、或把其余四项判为超限，即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_quarterly_workbook.xlsx, /app/output/FIN3-WKN-153_operation_report.md."""

[[criterion]]
id = "R04"
name = "R04"
type = "binary"
weight = 10.0
description = """行情阻塞识别与恢复留痕完整：`FIN3-WKN-153_issue_log.csv` 与工作簿 `Issue_Log` 表含一条**类别为阻塞**的记录，逐项给出：文件 `/app/input_files/valuation/price_feed_20260930.csv`、现象为该文件大小 **0 字节 / 无任何记录**、影响为市值与净值计算中断、处置动作为改用 `/app/input_files/data/price_feed_20260930_repush.csv`（批次标识「重推件」）、依据为 `/app/input_files/internal/ops_email_20261008.txt`、状态为已恢复；且最终市值计算实际采用该重推件。缺任一要素、最终行情源不是重推件、或未识别该阻塞即不满足。 Deliverables to inspect: /app/output/FIN3-WKN-153_issue_log.csv, /app/output/FIN3-WKN-153_quarterly_workbook.xlsx."""

