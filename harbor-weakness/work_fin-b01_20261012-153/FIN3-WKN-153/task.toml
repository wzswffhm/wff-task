schema_version = "1.4"
# 格式： /app/output/{你的交付物名称}
artifacts = [
  "/app/output/FIN3-WKN-153_quarterly_workbook.xlsx",
  "/app/output/FIN3-WKN-153_operation_report.md",
  "/app/output/FIN3-WKN-153_reproduce.py",
  "/app/output/FIN3-WKN-153_holdings_coverage.csv",
  "/app/output/FIN3-WKN-153_issue_log.csv",
  "/app/output/FIN3-WKN-153_charts.png",
  "/logs/artifacts/output",
]
[task]
name = "work_fin/fin3-wkn-153"
version = "1.0.0"
description = "集合资管计划三季度持仓全量覆盖、有效持仓口径执行、行情阻塞恢复、净值复核与按现行条款的投资监督限额执行"
keywords = ["finance", "asset-management", "A1"]
[metadata]
task_id = "FIN3-WKN-153"
author_organization = "work_fin"
category = "weakness"
domain = "金融"
domain_l2 = "资产管理"
domain_l3 = "集合资管计划投资监督"
domain_l4 = "季度持仓复核与限额执行"
capabilities = "在含空文件数据源、指引字段失效、多 Sheet 长表与三类干扰记录的 workspace 中完成十个账户持仓全量读取与逐 sheet 覆盖留痕、按现行制度口径执行估值日归属/证券主数据状态/重复上报三项过滤、识别行情主件不可读的阻塞并依据运营说明改用数据组重推件、识别对账指引指定关联字段失效并依据数据字典换键、按每百元报价与份额净值分券种折算市值、复算资产净值与单位净值并与托管报告和银行对账单双向勾稽、按现行有效条款逐条测算五项投资限制比例并判定超限处置、按现行口径重述上期报告表述、交付任务拆解与完成状态表和七要素数据问题台账"
difficulty = "A1"
vl_dependency = "否"
source_note = "自出题（非甲方作业表），场景为券商资管对集合资产管理计划开展季度投资运作复核并出具报告；材料按真实资管期末对账与投资监督工作流重建为 7 个来源目录、25 个输入文件（持仓明细为十账户多 Sheet 工作簿共 295 行并含三类干扰记录、行情主件为 0 字节而重推件在 data 目录、对账指引指定的关联字段在两侧文件均不存在、投资限制条款含现行版与历史版两套阈值、上期报告采用已被替代的条款与全表汇总口径），真实场景交付物为季度复核工作簿、季度投资运作报告、可复算代码、持仓覆盖表、数据问题台账与复合图"
tools = "Python/Excel/Markdown/CSV/PNG"
domain_knowledge = "券商资管集合计划期末对账：有效持仓口径（估值日归属、证券主数据 status=active、同一账户同一证券同一数量的重复上报按 source_row_id 保留首条）、债券与非标按每百元报价折算市值而权益基金按份额净值折算、行情估值日过滤与前一交易日记录剔除、行情主件传输失败后改用数据组重推件、对账指引与数据字典的字段命名沿革（wind_code 已由 sec_code / instrument_id 取代）、资产净值 = 持仓市值 + 现金及清算备付金 + 应收 − 应付、单位净值与托管报告差额以基点计、银行对账单与托管现金勾稽、投资限制五项指标（单一证券 10%、单一发行人 15%、非标 5%、现金类 3% 下限、权益基金 20%）以计划资产净值为分母、超限 T+2 整改与报告披露、条款版本替代关系与历史版不适用、上期报告口径重述"
task_complexity = "C4"
weakness_tag = ["W03-阻塞状态的识别与恢复能力较差", "W07-长表格/多 Sheet 下的数据覆盖与抗干扰能力弱", "W13-规划与策略调整失当"]
environment_template = "python3.12-claude2.1.114-rewardkit0.1.7"
tool_set = ["filesystem", "shell", "python"]
skill_set = []
expected_tool_dependencies = ["filesystem", "shell", "python"]
expected_skill_dependencies = []
tags = ["finance", "asset-management", "A1", "weakness", "fund-operations", "investment-restriction", "nav-recalculation", "multi-sheet-coverage", "blocker-recovery", "llm-judge"]
[[metadata.deliverables]]
path = "FIN3-WKN-153_quarterly_workbook.xlsx"
required = true
desc = "主交付物：季度复核工作簿，含 Coverage、Holdings_Summary、Valuation_Recalc、Nav_Bridge、Compliance_Check、Issue_Log、Task_Status、Prev_Report_Fix 八个模块工作表"
[[metadata.deliverables]]
path = "FIN3-WKN-153_operation_report.md"
required = true
desc = "季度投资运作报告，不超过 2 页，按模板八个章节成文，说明净值复核、持仓覆盖、限额执行、上期口径重述与结论"
[[metadata.deliverables]]
path = "FIN3-WKN-153_reproduce.py"
required = true
desc = "可复算代码，从 input_files 读入原始材料并计算全部结论，不硬编码结果"
[[metadata.deliverables]]
path = "FIN3-WKN-153_holdings_coverage.csv"
required = true
desc = "持仓覆盖表：逐 sheet 给出原始行数、三类剔除行数、有效行数与有效市值，末行为合计"
[[metadata.deliverables]]
path = "FIN3-WKN-153_issue_log.csv"
required = true
desc = "数据问题与阻塞台账：按类别、文件、现象、影响、处置动作、依据、状态七要素逐条登记"
[[metadata.deliverables]]
path = "FIN3-WKN-153_charts.png"
required = true
desc = "复合图：五项限额指标测算值与限额对比 + 十账户 sheet 原始与有效记录数覆盖"
[agent]
timeout_sec = 72000.0
[verifier]
timeout_sec = 18000.0
user = "root"
[verifier.env]
# Judge 相关变量统一 JUDGE_ 前缀，只写在 [verifier.env]、严禁写入 [environment.env]。
# 必选项（运行环境注入，AP 必给）；可选项一律用 ${VAR:-默认值} 语法给默认值。
JUDGE_API_KEY = "${JUDGE_API_KEY:-}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-qwen3.7-plus}"
JUDGE_PROVIDER = "${JUDGE_PROVIDER:-anthropic}"
JUDGE_API_PROTOCOL = "${JUDGE_API_PROTOCOL:-anthropic}"
# 兼容旧环境的兜底注入
EVAL_API_KEY = "${EVAL_API_KEY:-}"
EVAL_API_BASE = "${EVAL_API_BASE:-}"
LITELLM_DROP_PARAMS = "true"
[environment]
os = "linux"
build_timeout_sec = 18000.0
network_mode = "public"      # claude-code 框架下不要写 no-network
cpus = 2
memory_mb = 8192
storage_mb = 30720           # 照抄
