name = "R21"
description = "约束检查 C5–C9：对三个候选方案与推荐方案逐条给出 C5–C9 的通过/未通过判断与超限幅度；其中 C5（外币资产敞口 = 美元现金及存款 + 不对冲汇率的标普500 QDII，不超过 25%）须按 `/app/input_files/params_limits.csv` 的口径说明判定，即标普500 QDII 计入外币敞口；C8/C9（压力限额）须给出最大压力损失与 −8.0% / −7.0% 限额的比较。缺任一条检查或超限项未给幅度的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

