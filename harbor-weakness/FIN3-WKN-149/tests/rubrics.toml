[judge]
judge = "claude-code"          # 固定值，判官类型
prompt_template = "prompt.md"  # 固定值，指向同目录 prompt.md
model = "qwen3.7-plus"         # 裁判模型，照抄
timeout = 7200                 # 单个 judge 会话超时秒数
mode = "individual"            # 每条评分点独立评分
weight = 1.0                   # 固定值，照抄

# ============================ 正向：指令遵循 ============================
[[criterion]]
id = "R01"
name = "R01"
description = "交付物齐全：`/app/output/` 下存在全部 12 项必交文件——备忘录 `FIN3-WKN-149_风险委员会决策备忘录.md`、可复算代码 `FIN3-WKN-149_reproduce.py`、以及 `FIN3-WKN-149_charts/` 目录下 10 个 PNG（chart01 数据覆盖与缺口、chart02 方案累计净值、chart03 风险指标与限额、chart04 情景合格月份、chart05 历史窗口校准冲击、chart06 两套冲击对比、chart07 方案决策与限额、chart08 调仓现金路径、chart09 反向压力测试、chart10 监测指标触发状态）。文件名须与上述逐字一致（大小写、下划线、连字符均不得改动），不得添加日期或版本号等动态成分；图表须为 PNG 格式。任一文件缺失、为空或非 PNG 即不满足。 Deliverables to inspect: `/app/output/`."
type = "binary"
weight = 3.0

[[criterion]]
id = "R02"
name = "R02"
description = "备忘录按 `/app/input_files/template_memo.md` 的八个章节组织：一、结论与建议；二、数据核验与样本区间；三、当前组合风险画像；四、情景识别与历史校准；五、压力测试结果；六、候选方案评估与九项约束检查；七、推荐方案与调仓执行；八、反向压力测试与监测预警。八章标题均可辨识（措辞可微调、可加副标题），且每章填写了实质内容而非保留模板的填写要求占位文字。缺章或章节为空壳的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 3.0

# ============================ 正向：内容质量-结论正确性 ============================
[[criterion]]
id = "R03"
name = "R03"
description = "核心结论正确：明确给出三个候选方案都不能同时通过九项检查，并准确指出——方案A 未通过第 8 项（最大压力损失超过 8.0%）与第 9 项；方案B 未通过第 9 项（最大压力损失超过 7.0%）；方案C 未通过第 5 项，原因是把不对冲汇率的标普500 QDII 计入外币资产敞口（20% 美元现金 + 10% 标普500 = 30%，超过 25%）。三项判定须全部正确且归因正确；漏判、错判任一方案的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 10.0

[[criterion]]
id = "R04"
name = "R04"
description = "推荐方案正确：给出一个九项检查全部通过的推荐方案，其权重与 `/app/input_files/params_holdings.csv` 的 `weight_recommended` 列一致（沪深300 14.75%、中证500 8.85%、创业板 5.90%、中长期国债 30.50%、美元现金及存款 10.00%、标普500 QDII 10.00%、人民币现金及货基 20.00%，合计 100%），并给出该方案的构造依据。任一权重偏差超过 0.50 个百分点、或未给出构造依据、或推荐方案未通过九项检查的，不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 10.0

# ============================ 正向：内容质量-数据核验与口径 ============================
[[criterion]]
id = "R05"
name = "R05"
description = "数据核验要素齐备：正确给出样本区间为 2018-01-02 至 2026-06-09、终止原因为中债国债收益率曲线的五个期限在同一天终止、该曲线距分析截至日 2026-09-15 缺少的上交所交易日数量（须与 `/app/input_files/snapshot_trade_calendar.csv` 一致）；并指出 Shibor 记录数恰为 2000 条、实际起点晚于 2018 年初、而 `/app/input_files/snapshot_data_manifest.csv` 把该序列的 `possible_truncation` 标为 false 的矛盾；以及 1 年期 LPR、制造业 PMI、社融存量各自的缺失期次。上述要素缺任一项即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R06"
name = "R06"
description = "休市日异常识别与剔除：指出 2026-09-12（周六）沪深300（000300）与中证500（000905）各存在 1 条本不应有的记录，并给出可核验的判定依据——该记录的 pre_close 等于前一交易日收盘价（4510.1554 / 7580.5371），或其成交额仅为前一交易日的 1.61% / 0.80%；且明确将该记录剔除、不参与后续计算。仅笼统声称'清洗了异常数据'而不给出依据与标的的，不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R07"
name = "R07"
description = "结构性空值处理：指出三类结构性空值——5 年期 LPR 在 2019-08-16 及以前为空、美国国债 m2 在 2018-10-16 之前为空、美国国债 m4 在 2026-09-08 之前为空（该品种仅 6 条记录），并明确说明这些空值未被按 0 参与计算。缺任一类或未声明'不按 0 计算'的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R08"
name = "R08"
description = "价格对齐与汇率口径：说明所有跨市场序列在计算收益前按上交所估值日对齐、不同市场交易日不一致时按前向填充处理、结构性空值不参与填充；并指出 USD/CNH 的日期标注口径在 2022-09-18 至 2023-05-26 之间发生变化、须先对齐价格再计算收益。两项缺一即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`, `/app/output/FIN3-WKN-149_reproduce.py`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R09"
name = "R09"
description = "国债收益口径正确：中长期国债组合的价格变动按关键期限久期折算，五个期限的久期贡献为 1 年 0.10、2 年 0.30、5 年 1.20、10 年 3.60、30 年 1.80（合计修正久期 7.00），即收益率每上行 1bp 组合价格变动约 −0.07%；未把收益率差值（bp 或 pp）直接当作组合收益加总。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`, `/app/output/FIN3-WKN-149_reproduce.py`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R10"
name = "R10"
description = "汇率折算口径正确：标普500 的人民币计收益按 (1 + 标普500 美元计变动率) × (1 + USD/CNH 变动率) − 1 复合折算，未使用加法近似。 Deliverables to inspect: `/app/output/FIN3-WKN-149_reproduce.py`, `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

# ============================ 正向：内容质量-数值与计算准确性 ============================
[[criterion]]
id = "R11"
name = "R11"
description = "历史风险指标：对当前持仓与各候选/推荐方案给出年化波动率、1 日 VaR95 与 VaR99、1 日 ES95 与 ES99、10 日 VaR99、10 日最大累计损失（含区间）、最大回撤（含区间与修复日）、最差单日损失，并采用历史模拟法口径。评分为 1–5 整数：5=全部方案全部指标齐备且口径正确；4=个别指标缺失或口径有轻微偏差；3=约半数指标缺失或口径错误；2=多数指标缺失；1=未给出或完全错误。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "likert"
points = 5
weight = 7.0

[[criterion]]
id = "R12"
name = "R12"
description = "情景识别与历史校准：按 `/app/input_files/rules_scenarios.csv` 的月度规则给出四个情景的全部合格月份；按 `/app/input_files/rules_windows.csv` 构造历史窗口（合格月份内每个交易日为窗口起点、取其后 10 个上交所交易日、保留窗口内组合日收益全部为负者、按累计跌幅排序，数量不少于 20 个），给出各情景窗口起止日与合格窗口数；校准冲击取全部合格窗口内各风险因子 10 个交易日累计变动的中位数。评分为 1–5 整数：5=四情景合格月份、窗口构造与校准冲击全部正确；4=个别月份或个别因子有偏差；3=约半数不合格；2=多数不合格；1=未给出或规则使用错误。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "likert"
points = 5
weight = 7.0

[[criterion]]
id = "R13"
name = "R13"
description = "压力测试完整性：给出全部方案 × 4 个情景 × 2 套冲击（委员会沿用冲击与历史校准冲击）的压力结果，且每个结果都拆分为境内权益、标普500（人民币计）、美元现金、国债四部分贡献，四部分之和等于组合损益（允许四舍五入误差）；并给出各方案的最大压力损失及其来源情景与冲击类型。结果条数不足、未拆分四部分、或四部分之和与合计明显不符的，不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R14"
name = "R14"
description = "九项约束逐条检查：对三个候选方案与推荐方案逐条给出 C1–C9 的通过/未通过判断与超限幅度；其中 C5（外币资产敞口 = 美元现金及存款 + 不对冲汇率的标普500 QDII，不超过 25%）须按 `/app/input_files/params_limits.csv` 的口径说明判定，即标普500 QDII 计入外币敞口。缺任一条检查的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

# ============================ 正向：内容质量-调仓与执行 ============================
[[criterion]]
id = "R15"
name = "R15"
description = "调仓执行：给出交易清单（证券、方向、金额，单位万元，保留两位小数）与执行顺序；给出单向换手率（卖出金额合计 / 组合净值，约 20.50%）；给出先卖后买路径下的现金占比路径并验证全程不低于 8% 下限；给出先买后卖路径会击穿 8% 下限（现金占比降至负值）的结论。缺任一项不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R16"
name = "R16"
description = "反向压力测试：给出推荐方案在最大损失情景下的损失、距 8.0% 上限的裕度与放大倍数；给出样本内最差 10 日累计损失及其区间；给出反向压力测试的约束条件（组合损益 = 最大压力损失）、最小化目标（马氏距离）、最可能情景各风险因子变动与最小马氏距离；并给出委员会沿用冲击与历史校准窗口在同一协方差口径下的马氏距离。评分为 1–5 整数：5=全部要素齐备且方法正确；4=个别要素缺失或偏差；3=约半数要素缺失；2=多数缺失；1=未给出或方法错误。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "likert"
points = 5
weight = 7.0

[[criterion]]
id = "R17"
name = "R17"
description = "监测预警：给出八个监测指标的阈值、最新值、截至日（2026-09-15）状态与是否触发；识别因数据缺口而无法判断截至日状态的指标（10 年期国债收益率、制造业 PMI）；给出是否需要提请临时风险会议与数据补齐后的重新判断安排。评分为 1–5 整数：5=八项指标齐备、缺口识别正确、结论明确；4=个别指标缺失或缺口识别不全；3=约半数缺失；2=多数缺失；1=未给出。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "likert"
points = 5
weight = 7.0

# ============================ 正向：内容质量-分析与论证质量 ============================
[[criterion]]
id = "R18"
name = "R18"
description = "分析与论证质量：各章结论均有对应的数据支撑（表格引用或可追溯的计算过程），论证路径完整可复核；对'委员会沿用冲击与历史校准冲击的严格程度差异'给出原因分析；说明推荐方案的唯一性（同换手率下次优组合的比较）。评分为 1–5 整数：5=充分；4=基本充分，个别论点论据薄弱；3=部分论点缺论据；2=多数论点仅为复述而无分析；1=无实质分析。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "likert"
points = 5
weight = 7.0

# ============================ 正向：内容质量-事实忠实性 ============================
[[criterion]]
id = "R19"
name = "R19"
description = "事实忠实性：备忘录中的关键数值（样本区间与交易日数、休市日异常的 pre_close 与成交额比例、结构性空值日期、久期贡献、各方案风险指标、压力损失、监测指标最新值等）可追溯到 `/app/input_files/` 中的原始快照或由该快照推导，不存在编造或与输入材料相矛盾的数据。抽查发现编造的关键数值，或存在与 `input_files` 直接冲突的数字，即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`, `/app/input_files/`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R20"
name = "R20"
description = "可复算性：`FIN3-WKN-149_reproduce.py` 从 `/app/input_files/` 的原始快照读入，不硬编码任何结论数值（例如把压力损失、风险指标、窗口起止日期、推荐方案结论直接写成常量），且运行后能复现备忘录中的数字与图表。存在硬编码结论数值、或无法从快照复算的，不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_reproduce.py`."
type = "binary"
weight = 7.0

# ============================ 正向：操作与交付安全 ============================
[[criterion]]
id = "R21"
name = "R21"
description = "操作与交付安全：未修改、未删除、未覆盖 `/app/input_files/` 中的任何文件（该目录应保持只读状态），未破坏任何任务输入材料。 Deliverables to inspect: `/app/input_files/`."
type = "binary"
weight = 7.0

# ============================ 负向：negate + 正 weight ============================
[[criterion]]
id = "N01"
name = "N01"
description = "交付物存在致命问题：任一必交文件缺失、为空或完全不可用（无法打开或无可解析内容），或输出中未脱敏地包含个人隐私或敏感数据（如身份证号、手机号、银行账号）。仅当发现明确证据证明问题存在时判定成立。 Deliverables to inspect: `/app/output/`."
type = "binary"
negate = true
weight = 10.0

[[criterion]]
id = "N02"
name = "N02"
description = "给出结论但缺少对应的数据支撑（表格引用或可追溯的计算过程）。按违规程度判定（negate 条目，Reward Kit 归一化后自动翻转计分）：5=绝大多数结论无任何数据支撑；4=超过半数结论缺少数据支撑；3=约半数结论缺少数据支撑；2=仅个别结论缺少数据支撑；1=所有结论均有表格引用或可追溯的计算过程。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "likert"
points = 5
negate = true
weight = 7.0

[scoring]
aggregation = "weighted_mean"
