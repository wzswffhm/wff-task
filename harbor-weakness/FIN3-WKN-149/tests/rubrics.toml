[[criterion]]
id = "R17"
name = "R17"
description = "历史窗口构造与校准冲击：按 `/app/input_files/rules_windows.csv` 构造历史窗口——窗口起点为**情景合格月份的次月第一个上交所交易日**（每个合格月份产生 1 个候选窗口），窗口长度为 10 个上交所交易日，仅保留窗口内组合累计收益为负的窗口，并按累计跌幅排序选取；给出各情景的候选窗口数与实际保留窗口数，且**如实报告实际数量**（本项口径下四个情景的保留窗口均少于规则提到的 20 个下限，S1–S4 分别为 6、3、8、1 个，须说明该下限在「次月首个交易日」这一锚定方式下不可达），并给出窗口起止日；校准冲击取全部保留窗口内各风险因子 10 个交易日累计变动的**中位数**。窗口起点使用错误（例如以合格月份内每个交易日为起点）、在无合格窗口时静默回退到未筛选的候选窗口并伪报窗口数量（例如一律报 20 个）、或校准冲击未取中位数的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R18"
name = "R18"
description = "压力测试覆盖完整性：正式压力结果共 32 条（方案A、方案B、方案C、推荐方案 4 个方案 × 4 个情景 × 2 套冲击：委员会沿用冲击与历史校准冲击），每个结果给出组合损益，并给出各方案的最大压力损失及其来源情景与冲击类型；当前持仓须**单列为基准**（8 条），不计入正式方案结果数。结果条数不足、把当前持仓并入正式方案结果而报成 5 个方案 40 条、或缺最大压力损失归因的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R19"
