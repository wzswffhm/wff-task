[judge]
judge = "claude-code"          # 固定值，判官类型
prompt_template = "prompt.md"  # 固定值，指向同目录 prompt.md
model = "qwen3.7-plus"         # 裁判模型，照抄
timeout = 7200                 # 单个 judge 会话超时秒数
mode = "individual"            # 每条评分点独立评分
weight = 1.0                   # 固定值，照抄

# ============================ 正向：指令遵循 ============================
[[criterion]]
id = "R01"
name = "R01"
description = "交付物齐全：`/app/output/` 下存在全部 7 项必交文件——备忘录 `FIN3-WKN-149_风险委员会决策备忘录.md`、可复算代码 `FIN3-WKN-149_reproduce.py`、以及 `FIN3-WKN-149_charts/` 目录下 5 张复合图 PNG（`FIN3-WKN-149_chart01_数据覆盖与缺口.png`、`FIN3-WKN-149_chart02_历史风险总览.png`、`FIN3-WKN-149_chart03_情景识别与校准.png`、`FIN3-WKN-149_chart04_方案决策与执行.png`、`FIN3-WKN-149_chart05_监测指标触发状态.png`）。文件名须与上述逐字一致（大小写、下划线、连字符均不得改动），不得添加日期或版本号等动态成分；图表须为 PNG 格式。任一文件缺失、为空或非 PNG 即不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`, `/app/output/FIN3-WKN-149_reproduce.py`, `/app/output/FIN3-WKN-149_charts/FIN3-WKN-149_chart01_数据覆盖与缺口.png`, `/app/output/FIN3-WKN-149_charts/FIN3-WKN-149_chart02_历史风险总览.png`, `/app/output/FIN3-WKN-149_charts/FIN3-WKN-149_chart03_情景识别与校准.png`, `/app/output/FIN3-WKN-149_charts/FIN3-WKN-149_chart04_方案决策与执行.png`, `/app/output/FIN3-WKN-149_charts/FIN3-WKN-149_chart05_监测指标触发状态.png`."
type = "binary"
weight = 3.0

# ============================ 正向：结构与组织 ============================
[[criterion]]
id = "R02"
name = "R02"
description = "备忘录按 `/app/input_files/template_memo.md` 的八个章节组织：一、结论与建议；二、数据核验与样本区间；三、当前组合风险画像；四、情景识别与历史校准；五、压力测试结果；六、候选方案评估与九项约束检查；七、推荐方案与调仓执行；八、反向压力测试与监测预警。八章标题均可辨识（措辞可微调、可加副标题），且每章填写了实质内容而非保留模板的填写要求占位文字。缺章或章节为空壳的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 3.0

# ============================ 正向：内容质量-结论正确性 ============================
[[criterion]]
id = "R03"
name = "R03"
description = "核心结论正确：明确给出三个候选方案都不能同时通过九项检查，并准确指出——方案A 未通过第 8 项（最大压力损失超过 8.0%）与第 9 项；方案B 未通过第 9 项（最大压力损失超过 7.0%）；方案C 未通过第 5 项，原因是把不对冲汇率的标普500 QDII 计入外币资产敞口（20% 美元现金 + 10% 标普500 = 30%，超过 25%）。三项判定须全部正确且归因正确；漏判、错判任一方案的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 10.0

[[criterion]]
id = "R04"
name = "R04"
description = "推荐方案正确：给出一个九项检查全部通过的推荐方案，其权重与 `/app/input_files/params_holdings.csv` 的 `weight_recommended` 列一致（沪深300 14.75%、中证500 8.85%、创业板 5.90%、中长期国债 30.50%、美元现金及存款 10.00%、标普500 QDII 10.00%、人民币现金及货基 20.00%，合计 100%），并给出该方案的构造依据。任一权重偏差超过 0.50 个百分点、或未给出构造依据、或推荐方案未通过九项检查的，不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 10.0

# ============================ 正向：内容质量-数值与计算准确性 ============================
[[criterion]]
id = "R05"
name = "R05"
description = "样本区间与终止原因正确：给出样本区间为 2018-01-02 至 2026-06-09、区间内共 2,044 个上交所交易日、终止原因为中债国债收益率曲线的五个期限在同一天终止，并给出该曲线距分析截至日 2026-09-15 缺少 69 个上交所交易日。四项要素缺任一即不满足（交易日数量须与 `/app/input_files/snapshot_trade_calendar.csv` 一致）。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 3.0

[[criterion]]
id = "R06"
name = "R06"
description = "数据完整性矛盾识别：指出 Shibor 记录数恰为 2000 条、实际起点为 2018-09-03（明显晚于 2018 年初），而 `/app/input_files/snapshot_data_manifest.csv` 把该序列的 `possible_truncation` 标为 false，两者存在矛盾。未指出该矛盾、或记录数/起点描述错误的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 3.0

[[criterion]]
id = "R07"
name = "R07"
description = "低频序列缺期识别：给出 1 年期 LPR、制造业 PMI、社融存量各自的缺失期次（相对月度序列应有频率而言的缺口）——1 年期 LPR 缺 2024-11、2026-08；制造业 PMI 缺 2026-08；社融存量缺 2026-05 至 2026-08。缺任一序列的缺失期次分析、或缺失期次明显错误的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 3.0

[[criterion]]
id = "R08"
name = "R08"
description = "休市日异常识别与剔除：指出 2026-09-12（周六）沪深300（000300）与中证500（000905）各存在 1 条本不应有的记录，并给出可核验的判定依据——该记录的 pre_close 等于前一交易日收盘价（4510.1554 / 7580.5371），或其成交额仅为前一交易日的 1.61% / 0.80%；且明确将该记录剔除、不参与后续计算。仅笼统声称'清洗了异常数据'而不给出依据与标的的，不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R09"
name = "R09"
description = "结构性空值处理：指出三类结构性空值——5 年期 LPR 在 2019-08-16 及以前为空、美国国债 m2 在 2018-10-16 之前为空、美国国债 m4 在 2026-09-08 之前为空（该品种仅 6 条记录），并明确说明这些空值未被按 0 参与计算、也不参与前向填充。缺任一类或未声明'不按 0 计算'的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

# ============================ 正向：内容质量-专业规范 ============================
[[criterion]]
id = "R10"
name = "R10"
description = "价格对齐口径：说明所有跨市场序列（标普500、USD/CNH、美国国债、Shibor、DR007 等）在计算收益前必须先对齐到上交所估值日；因不同市场交易日不一致，非上交所估值日的价格须按前向填充映射到估值日序列后再计算收益，不得直接用各市场原始日期或行号做差分。未说明按上交所估值日对齐、或未说明前向填充处理的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`, `/app/output/FIN3-WKN-149_reproduce.py`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R11"
name = "R11"
description = "国债收益口径正确：中长期国债组合的价格变动按关键期限久期折算，五个期限的久期贡献为 1 年 0.10、2 年 0.30、5 年 1.20、10 年 3.60、30 年 1.80（合计修正久期 7.00），即收益率每上行 1bp 组合价格变动约 −0.07%；未把收益率差值（bp 或 pp）直接当作组合收益加总。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`, `/app/output/FIN3-WKN-149_reproduce.py`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R12"
name = "R12"
description = "汇率折算口径正确：标普500 的人民币计收益按 (1 + 标普500 美元计变动率) × (1 + USD/CNH 变动率) − 1 复合折算，未使用加法近似。 Deliverables to inspect: `/app/output/FIN3-WKN-149_reproduce.py`, `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R13"
name = "R13"
description = "波动率与 VaR/ES 口径：对当前持仓与各候选/推荐方案给出年化波动率、1 日 VaR95 与 VaR99、1 日 ES95 与 ES99，并采用历史模拟法口径（经验分位数，非参数假设）。缺任一指标、把 VaR 与 ES 混用、或未用历史模拟法的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
id = "R14"
name = "R14"
description = "10 日风险指标：对当前持仓与各候选/推荐方案给出 10 日 VaR99 与 10 日最大累计损失，且最大累计损失给出真实发生区间（起点日与终点日），并非仅给单一数值。缺任一指标或未给区间的不满足。 Deliverables to inspect: `/app/output/FIN3-WKN-149_风险委员会决策备忘录.md`."
type = "binary"
weight = 7.0

[[criterion]]
