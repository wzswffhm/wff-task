schema_version = "1.4"
# 格式： /app/output/{你的交付物名称}
artifacts = [
  "/app/output/FIN3-WKN-151_授信审批报告.md",
  "/app/output/FIN3-WKN-151_reproduce.py",
  "/app/output/FIN3-WKN-151_charts/FIN3-WKN-151_chart01_材料覆盖与数据缺口.png",
  "/app/output/FIN3-WKN-151_charts/FIN3-WKN-151_chart02_财务与偿债能力.png",
  "/app/output/FIN3-WKN-151_charts/FIN3-WKN-151_chart03_现金流与营运效率.png",
  "/app/output/FIN3-WKN-151_charts/FIN3-WKN-151_chart04_额度测算与担保覆盖.png",
  "/app/output/FIN3-WKN-151_charts/FIN3-WKN-151_chart05_风险分类与授信条件.png",
  "/logs/artifacts/output",
]
[task]
name = "work_fin/fin3-wkn-151"
version = "1.0.2"
description = "商业银行对公客户年度授信重检与授信审批"
keywords = ["finance", "office", "A1"]
[metadata]
task_id = "FIN3-WKN-151"
author_organization = "work_fin"
category = "weakness"
domain = "金融"
domain_l2 = "商业银行"
domain_l3 = "对公授信审批"
domain_l4 = "授信额度测算与风险分类"
capabilities = "多材料覆盖核对与口径冲突处理、多渠道融资明细的数据清洗与外币折算、财务报表口径还原与偿债能力指标测算、营运资金需求测算与授信额度孰低确定、押品抵押率逐项折算与合格担保值测算、五级分类判断与授信条件设计"
difficulty = "A1"
vl_dependency = "否"
source_note = "自出高难度题（非甲方作业表）。场景为商业银行总行授信审批部对制造业集团客户的年度授信重检；客户财务数据、他行融资明细、押品评估、行内政策与行业数据均按真实业务逻辑重建为授信审批材料包（29 份文件），真实场景交付物为授信审批报告、可复算代码与配套图表"
tools = "Python/Excel/CSV/Markdown"
domain_knowledge = "对公授信审批：财务报表口径还原（审计口径 vs 管理口径）、偿债能力指标（资产负债率/流动比率/速动比率/利息保障倍数/净现比）、营运资金需求测算（销售利润率、营运资金周转次数、预计增长率审慎取值）、授信额度孰低原则（营运资金需求/担保覆盖/净资产/集中度）、押品抵押率折算与合格担保值、贷款五级分类与授信条件设计"
task_complexity = "C5"
weakness_tag = ["W02-关键冲突下自行选边 / 修改输入", "W07-长表格/多 Sheet 下的数据覆盖与抗干扰能力弱", "W12-跨源交叉核对缺失"]
environment_template = "python3.12-claude2.1.114-rewardkit0.1.7"
tool_set = ["filesystem", "shell", "python"]
skill_set = []
expected_tool_dependencies = ["filesystem", "shell", "python"]
expected_skill_dependencies = []
tags = ["finance", "office", "A1", "weakness", "credit-approval", "commercial-bank", "risk-classification", "llm-judge"]
[[metadata.deliverables]]
path = "FIN3-WKN-151_授信审批报告.md"
required = true
desc = "主交付物：授信审批报告，按模板八个章节填写"
[[metadata.deliverables]]
path = "FIN3-WKN-151_reproduce.py"
required = true
desc = "可复算代码，从 input_files 原始材料读入、不硬编码结果"
[[metadata.deliverables]]
path = "FIN3-WKN-151_charts/FIN3-WKN-151_chart01_材料覆盖与数据缺口.png"
required = true
desc = "复合图：材料覆盖分布与核验标记"
[[metadata.deliverables]]
path = "FIN3-WKN-151_charts/FIN3-WKN-151_chart02_财务与偿债能力.png"
required = true
desc = "复合图（a）资产负债结构与资产负债率 /（b）流动比率、速动比率、利息保障倍数"
[[metadata.deliverables]]
path = "FIN3-WKN-151_charts/FIN3-WKN-151_chart03_现金流与营运效率.png"
required = true
desc = "复合图（a）净利润、经营现金流与净现比 /（b）存货、应收账款、应付账款周转天数"
[[metadata.deliverables]]
path = "FIN3-WKN-151_charts/FIN3-WKN-151_chart04_额度测算与担保覆盖.png"
required = true
desc = "复合图（a）各项额度约束对比与孰低结果 /（b）担保覆盖结构"
[[metadata.deliverables]]
path = "FIN3-WKN-151_charts/FIN3-WKN-151_chart05_风险分类与授信条件.png"
required = true
desc = "复合图（a）关键指标与预警线 /（b）风险矩阵与建议分类"
[agent]
timeout_sec = 72000.0
[verifier]
timeout_sec = 18000.0
user = "root"
[verifier.env]
# Judge 相关变量统一 JUDGE_ 前缀，只写在 [verifier.env]、严禁写入 [environment.env]。
# 必选项（运行环境注入，AP 必给）；可选项一律用 ${VAR:-默认值} 语法给默认值。
JUDGE_API_KEY = "${JUDGE_API_KEY:-}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-qwen3.7-plus}"
JUDGE_PROVIDER = "${JUDGE_PROVIDER:-anthropic}"
JUDGE_API_PROTOCOL = "${JUDGE_API_PROTOCOL:-anthropic}"
# 兼容旧环境的兜底注入
EVAL_API_KEY = "${EVAL_API_KEY:-}"
EVAL_API_BASE = "${EVAL_API_BASE:-}"
LITELLM_DROP_PARAMS = "true"
[environment]
os = "linux"
build_timeout_sec = 18000.0
network_mode = "public"      # claude-code 框架下不要写 no-network
cpus = 2
memory_mb = 8192
storage_mb = 30720           # 照抄
