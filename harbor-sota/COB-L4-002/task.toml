[task]
name = "wff-eval/cob-l4-002"
version = "1.0.0"
description = "银行核心系统贷款日终批处理（v10 口径：多模块 COBOL 程序、59 份分片数据源与业务参数表、工作日历、还款计划/逾期罚息/利息转本/提前结清/到期日顺延/混合还本计划/多币种汇率折算/费用冲销/利率暂停/分币种汇总）COBOL→Java 迁移与逻辑等价校验"
keywords = ["cobol", "office", "L4"]

[metadata]
task_id = "COB-L4-002"
domain = "非常规语言"
category_l1 = "非常规语言"
category_l2 = "COBOL / JCL"
scene_l3 = "COBOL→Java 迁移改写与逻辑等价校验"
capabilities = "多模块遗留代码理解、工作日历与还款计划还原、逾期罚息与还款核销实现、双应计池处理、无基准独立等价验证、迁移文档撰写"
office_task_type = "T8 全流程"
difficulty = "L4"
vl_dependency = "不依赖vl"
source_note = "银行核心系统日终批处理 COBOL→Java 等价迁移是真实的付费咨询场景（大型机系统现代化项目常见外包标的）；本题以贷款日终批处理为对象，v4 口径覆盖真实银行常见的多模块程序结构、节假日工作日历、等额本金还款计划、逾期罚息与还款核销、利率调整历史、30/360 月末计息与利息转本。样例数据为高仿真造数并脱敏：客户名替换为客户编码，账户号与金额均为仿真值，不涉及真实个人信息。按真实迁移项目惯例，任务书不提供原程序期望输出基准，且源程序为无注释说明的遗留代码，候选须独立阅读理解并验证等价性；参考答案由内部参考实现按 COBOL 口径生成，仅用于评分。v10 将数据源按产品/账户区间/年度分片为 59 份文件并新增业务参数表（产品、币种、计息基准、状态码、交易码、费用、税率、机构、批控、科目映射），候选须按目录模式读取全部数据文件并完成参数一致性校验。"
tools = "JDK21 / javac / java / 文本比对"
expert_minutes = 1080
domain_knowledge = "贷款日终批处理口径：多计息基准（A360/A365 逐日、B30D 月末）、阶梯利率、利率调整历史、等额本金还款计划、节假日工作日历在宽限/逾期判定中的应用、还款顺序与 FIFO 核销、逾期罚息（有效利率×1.5）、利息转本复利、COBOL ROUNDED 半进位舍入、非应计/结清停息"
expected_pass_rate = 0.08

