[judge]
judge = "openai/gpt-5.5"
files = [
  "/app/output/COB-L4-002_LoanAccrual.java",
  "/app/output/COB-L4-002_AccrualResult.txt",
  "/app/output/COB-L4-002_MigrationReport.md",
  "/app/output/COB-L4-002_SummaryByCurrency.txt",
]
reference = "/tests/golden_output"
mode = "individual"
timeout = 300

[[criterion]]
id = "R1"
description = "COB-L4-002_AccrualResult.txt 的 100 个账户 NORMAL（正常应计）列与参考答案逐账户完全一致（100 行明细逐字段比对，任一账户任一值差异即不通过）：A360/A365 逐日、B30D 月末，且每次对精确乘积半进位舍入到分后累加、中间不截断"
type = "binary"
weight = 10.0

[[criterion]]
id = "R2"
description = "100 个账户 PENALTY（罚息应计）列与参考答案逐账户完全一致（任一账户差异即不通过）：对逾期本金按罚息利率（有效年利率×1.5）以实际天数/365 逐日计罚息、每日单独舍入"
type = "binary"
weight = 10.0

[[criterion]]
id = "R3"
description = "100 个账户 OVERDUE（逾期本金）列与参考答案完全一致（任一账户差异即不通过）：按 SCHEDULE.DAT 还款计划、应还日后第（宽限+1）个工作日（周末与 CALENDAR.DAT 节假日顺延）起逾期、还款本金按应还日 FIFO 核销"
type = "binary"
weight = 10.0

[[criterion]]
id = "R4"
description = "PRINCIPAL（期末本金）列与参考答案完全一致（任一账户差异即不通过）：本金变动按起息日生效，含 PINT 利息转本复利（入账金额=入账前正常+罚息应计之和、两池清零）、DISB 增额、还款先冲罚息/利息后冲本金的顺序"
type = "binary"
weight = 10.0

[[criterion]]
id = "R5"
description = "利率调整历史正确（任一账户差异即不通过）：RATE_ADJ.DAT 生效日（含）起覆盖基准年利率直至下次调整或当前日期；阶梯利率档位（≤5万加1.00%、≤20万加0.50%、>20万加0.00%，端点包含）与暂停期（利率 0 不计息不加 margin）处理正确，相关账户金额与参考答案完全一致"
type = "binary"
weight = 10.0

[[criterion]]
id = "R6"
description = "POSTED（已入账利息）列 100 个账户与参考答案一致：PINT 入账金额按流水（等于入账前正常+罚息应计之和）转本、两个应计池清零的口径正确"
type = "binary"
weight = 7.0

[[criterion]]
id = "R7"
description = "停息口径正确：状态 N/L 自 STATUS-DATE（含当日）起停止计息与罚息，逾期余额仍按口径展示"
type = "binary"
weight = 7.0

[[criterion]]
id = "R8"
description = "日期口径完全正确（任一账户日期相关值不一致即不通过）：按实际天数逐日推进且运行日含当日，跨 2020 闰年（含 2020-02-29）账户金额一致，B30D 月末按自然月最后一个日历日判断，宽限逾期按工作日（跳过周末与节假日）"
type = "binary"
weight = 10.0

[[criterion]]
id = "R9"
description = "汇总行 TOTAL 格式与合计正确：ACCTS=100，PRINCIPAL/NORMAL/PENALTY/ACCRUED/POSTED/REPAID/OVERDUE/FEES/LATEFEES 十项与参考答案完全一致"
type = "binary"
weight = 3.0

[[criterion]]
id = "R10"
description = "COB-L4-002_LoanAccrual.java 为可编译的单文件 Java（JDK21、仅标准库、无第三方依赖），main 从 /app/input_files 读取全部数据文件（账户主档 ACCT_MASTER_*.DAT、交易 TRAN_HIST_*.DAT、利率调整 RATE_ADJ_*.DAT、还款计划 SCHED_*.DAT、日历 CAL_*.DAT、汇率 FX_RATE_USD.DAT、运行日 PROC_DATE.TXT，以及 PROD_PARAM/CCY_PARAM/BASIS_CODE/STATUS_CODE/TRN_CODE/BATCH_PARAM/FEE_PARAM/TAX_PARAM/ORG_PARAM/GL_MAP 十类参数表）并完成参数一致性校验后写出结果文件"
type = "binary"
weight = 10.0

[[criterion]]
id = "R11"
description = "COB-L4-002_MigrationReport.md 含完整迁移映射表（COBOL 段落/子程序逐项对应 Java 类/方法，覆盖主程序、子程序 CLN-DTUTIL、各 COPYBOOK 数据装载与校验段落），并说明还款顺序、逾期 FIFO 核销、罚息率、工作日宽限与 BigDecimal HALF_UP 的等价处理"
type = "binary"
weight = 7.0

[[criterion]]
id = "R12"
description = "报告说明无基准输出下的验证方法并给出可复核证据（如手算窗口样例、不变量核对、独立复算结果），证据数据能与结果文件溯源对应，而非仅描述迁移过程"
type = "binary"
weight = 7.0

[[criterion]]
id = "R13"
description = "报告说明日期与舍入口径：A360/A365 分母、B30D 月末判断、工作日宽限、2020-02-29 计入计息天数、运行日含当日、每次计息一次舍入到分"
type = "binary"
weight = 3.0

[[criterion]]
id = "R14"
description = "四个交付物文件名逐字为 COB-L4-002_LoanAccrual.java / COB-L4-002_AccrualResult.txt / COB-L4-002_MigrationReport.md / COB-L4-002_SummaryByCurrency.txt，与任务书一致，无改名或多余交付文件"
type = "binary"
weight = 7.0

[[criterion]]
id = "R15"
description = "修改了 /app/input_files 中的源文件，或输出写入 /app/output 以外的位置"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R16"
description = "交付物违反硬约束：Java 非单文件或引入第三方依赖、结果文件非 14 列 100 行明细+1 行汇总、报告非中文或超过 200 行、整段粘贴 COBOL/Java 源码"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R17"
description = "结果文件行数、列数或字段格式与任务书口径不一致（如明细行数不足、列顺序错误、金额定长/小数位/分隔符错误）"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R18"
description = "报告缺少迁移映射表或无基准验证方法说明，只对迁移过程做泛泛描述"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R19"
description = "结果文件与 Java 程序无法对应：结果文件缺失、内容为空或全零占位，或未提供任何可核对的运行/验证依据"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R20"
description = "交付物中出现无关文件或编译中间产物（如 .class、额外源码、临时文件）"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R21"
description = "COB-L4-002_SummaryByCurrency.txt 的 CNY/USD 两行小计与 TOTAL 行与参考答案逐列完全一致（账户数与 PRINCIPAL/NORMAL/PENALTY/ACCRUED/POSTED/REPAID/OVERDUE/FEES/LATEFEES 十项合计），分币种汇总口径正确"
type = "binary"
weight = 7.0

[[criterion]]
id = "R22"
description = "USD 账户金额按 FX_RATE_USD.DAT 生效季度汇率折算正确（任一账户差异即不通过）：取不晚于运行日的最近季度汇率、折算后 HALF_UP 舍入到分，相关账户在明细与汇总中的金额与参考答案一致"
type = "binary"
weight = 7.0

[[criterion]]
id = "R23"
description = "FEES（费用）与 LATEFEES（罚息费用）两列 100 个账户与参考答案一致：费用按流水入账、冲销顺序（FEE 优先于 LFE）与罚息费用计提口径正确"
type = "binary"
weight = 7.0

[[criterion]]
id = "R24"
description = "结果文件自洽性满足验收口径：汇总行十项与 100 行明细加总一致，各账户本金不为负、逾期本金不超过期末本金、应计非负"
type = "binary"
weight = 3.0

[[criterion]]
id = "R25"
description = "分币种汇总文件行数、币种标识或金额格式与任务书不一致（非 CNY/USD 两行小计加一行 TOTAL，或金额定长/小数位/分隔符错误）"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R26"
description = "报告给出抽查核对表：至少 6 个代表性账户（覆盖 B30D 月末、跨 2020 闰年、利率调整生效、逾期宽限、停息、USD 汇率折算各至少 1 个），每个账户列出 PRINCIPAL/NORMAL/PENALTY/ACCRUED 四列的复算过程与最终值，且与 COB-L4-002_AccrualResult.txt 对应账户逐值一致"
type = "binary"
weight = 7.0

[[criterion]]
id = "R27"
description = "报告给出至少 1 个完整手算窗口样例，展示从精确乘积到半进位舍入再到累加的完整中间过程（证明每天独立舍入、中间不截断），样例覆盖正常应计与罚息应计各至少一个计息日"
type = "binary"
weight = 7.0

[[criterion]]
id = "R28"
description = "Java 程序对全部十类参数表（PROD_PARAM/CCY_PARAM/BASIS_CODE/STATUS_CODE/TRN_CODE/BATCH_PARAM/FEE_PARAM/TAX_PARAM/ORG_PARAM/GL_MAP）执行一致性校验：产品/币种/计息基准/状态码/交易码/运行日/费用/税率/机构/科目映射任一不一致即报错退出，代码中体现完整校验逻辑"
type = "binary"
weight = 7.0

[[criterion]]
id = "R29"
description = "报告中的验证数字、抽查金额或手算样例与结果文件不一致、无法溯源或凭空编造（如引用了源文件中不存在的金额）"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R30"
description = "Java 程序未对全部参数表做一致性校验，或校验逻辑与 COBOL/任务书口径不符（如遗漏费用/税率/机构/科目映射校验、校验不报错仅跳过）"
type = "binary"
negate = true
weight = 7.0

[scoring]
aggregation = "weighted_mean"
