[judge]
judge = "openai/gpt-5.5"
files = [
  "/app/output/PLSQL-L4-001_归集存储过程_pg.sql",
  "/app/output/PLSQL-L4-001_迁移说明.md",
  "/tests/golden_output/PLSQL-L4-001_归集存储过程_pg.sql",
  "/tests/golden_output/PLSQL-L4-001_迁移说明.md",
]
mode = "individual"
timeout = 300

[[criterion]]
id = "R1"
description = "改写代码包含 CREATE OR REPLACE FUNCTION pkg_settle.daily_settle 且入参为 p_biz_date DATE"
type = "binary"
weight = 10.0

[[criterion]]
id = "R2"
description = "归集主循环使用 FOR r IN SELECT ... LOOP，遍历条件含 status = 'ACTIVE'，余额取 COALESCE(ab.balance, 0)"
type = "binary"
weight = 10.0

[[criterion]]
id = "R3"
description = "流水号通过 nextval('seq_settle_flow_id') 获取并写入 settle_flow"
type = "binary"
weight = 10.0

[[criterion]]
id = "R4"
description = "settle_summary 汇总使用 INSERT ... ON CONFLICT (biz_date) DO UPDATE 实现幂等 upsert"
type = "binary"
weight = 7.0

[[criterion]]
id = "R5"
description = "大额账户备注查询按 ab.balance DESC 排序并使用 LIMIT 3"
type = "binary"
weight = 7.0

[[criterion]]
id = "R6"
description = "EXCEPTION WHEN OTHERS 块内 ROLLBACK 后向 error_log 插入记录且 err_msg 使用 SQLERRM"
type = "binary"
weight = 7.0

[[criterion]]
id = "R7"
description = "函数开头保留幂等清理：先 DELETE 当日 settle_flow，再 DELETE 当日 settle_summary"
type = "binary"
weight = 7.0

[[criterion]]
id = "R8"
description = "代码中时间字段使用 now()（create_time / update_time）"
type = "binary"
weight = 7.0

[[criterion]]
id = "R9"
description = "迁移说明的映射表覆盖 %TYPE、NEXTVAL、SYSDATE、NVL、DECODE、MERGE、ROWNUM、TRUNC 至少 8 项"
type = "binary"
weight = 7.0

[[criterion]]
id = "R10"
description = "迁移说明明确 TRUNC(date) 的 PostgreSQL 处理方式（参数为 DATE 时直接使用，或说明 CAST / date_trunc）"
type = "binary"
weight = 7.0

[[criterion]]
id = "R11"
description = "迁移说明明确 MERGE INTO 对应 INSERT ... ON CONFLICT"
type = "binary"
weight = 7.0

[[criterion]]
id = "R12"
description = "迁移说明明确 ROWNUM 对应 LIMIT"
type = "binary"
weight = 7.0

[[criterion]]
id = "R13"
description = "迁移说明类型映射包含 NUMBER→NUMERIC、VARCHAR2→VARCHAR、VARCHAR2(4000)→TEXT"
type = "binary"
weight = 7.0

[[criterion]]
id = "R14"
description = "迁移说明明确 NVL 对应 COALESCE"
type = "binary"
weight = 7.0

[[criterion]]
id = "R15"
description = "迁移说明明确 DECODE 对应 CASE WHEN 或 COALESCE"
type = "binary"
weight = 7.0

[[criterion]]
id = "R16"
description = "改写保持业务口径：归集条件 status='ACTIVE'、按 branch_id 排序、金额逐账户累加，与原过程一致"
type = "binary"
weight = 3.0

[[criterion]]
id = "R17"
description = "改写代码引用了 schema_pg.sql 中不存在的表、列或序列（凭空编造结构）"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R18"
description = "业务口径被改变：如删除幂等清理、改变 ACTIVE 归集条件、金额计算或异常处理与原文不一致"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R19"
description = "迁移说明遗漏 MERGE、ROWNUM、NEXTVAL 中任一语法的映射说明"
type = "binary"
negate = true
weight = 7.0

[scoring]
aggregation = "weighted_mean"
