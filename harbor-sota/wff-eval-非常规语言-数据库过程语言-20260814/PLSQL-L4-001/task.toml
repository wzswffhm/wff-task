vl_dependency = "不依赖vl"
source_note = "真实银行核心系统国产化去 O 项目：存量 Oracle 存储过程迁移到 PostgreSQL 14，属于长期付费的数据库迁移改造服务。源码与表结构为高仿真遗留系统素材（含 %TYPE、游标、序列、MERGE、ROWNUM、异常处理等典型 Oracle 遗留写法），真实交付物即改写后的 PL/pgSQL 代码与迁移说明文档。"
tools = "SQL / PL/pgSQL"
