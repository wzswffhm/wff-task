source_note = "真实云厂商存储迁移项目的上线前一致性校验环节：客户从自建 Ceph RGW 迁到新对象存储，迁移工具完成复制后由独立校验确认新旧端一致。数据为高仿真清单（旧端 RGW 导出 + 新端 ListObjects 导出 + 抽样 ETag 比对），key 风格与字段格式参照真实对象存储；真实交付物即迁移校验报告与差异清单。"
