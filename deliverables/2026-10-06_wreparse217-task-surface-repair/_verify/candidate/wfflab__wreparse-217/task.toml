# Platform schema version fixed by the upstream Outside Harbor contract.
version = "1.0"

# Only a locked, immutable tag. The runtime underneath is Windows Server Core,
# which already ships the Windows PowerShell 5.1 the behaviour contract targets.
docker_image = "mcr.microsoft.com/windows/servercore:ltsc2022"

[metadata]
quality_restoration_version = "20260921.1"
author_name = "wfflab"
task_id = "wfflab__wreparse-217"
tags = ["coding", "windows", "powershell", "ntfs", "reparse-point", "filesystem"]
difficulty = "L3"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory = "4G"

# Local runner compatibility extension. These paths are relative to the task
# root and are re-validated by scripts/validate_requirement_conformance.py.
[task]
id = "wfflab__wreparse-217"
version = "1.0.0"
instruction = "instruction.md"
workspace = "environment/workspace"
setup = "environment/prepare.ps1"
test = "tests/test.ps1"
golden = "solution/solve.ps1"

[policy]
# The candidate may only change the module sources. The contract document and
# everything under tests/ stay authoritative and are not part of the solution.
mutable_paths = ["environment/workspace/WReparse"]
read_only_paths = ["instruction.md", "environment/prepare.ps1", "environment/run.ps1", "environment/restore.ps1", "environment/cleanup.ps1", "environment/validate_environment.ps1", "environment/workspace/docs", "tests"]
