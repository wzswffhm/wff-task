# Local Windows adapter; receiver Harbor integration remains a review gate.
version = "1.0"
runtime = "windows-local-account"
edition = "Windows Server 2022 Standard"
build = "20348"
architecture = "x64"
locale = "zh-CN"
shell = "Windows PowerShell 5.1"
framework = "NET Framework 4.x"
network = "blocked-per-local-user"
permissions = "standard-user; own workspace; assigned registry roots"
prepare = "prepare.ps1"
start = "run.ps1"
restore = "restore.ps1"
cleanup = "cleanup.ps1"
