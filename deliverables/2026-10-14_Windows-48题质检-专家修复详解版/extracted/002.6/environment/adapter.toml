adapter_schema_version = "harbor-adapter-0.1.0-pilot"
status = "pilot-local-confirmed"
environment_id = "local-windows-host"
runner = "powershell"
network = "task sandbox disabled; Harness model control-plane enabled"
privilege = "standard-user"
remote_exec_channel = "local-process"
secret_provider_ref = "Pilot process/User environment variables"
resource_lock = "local-host-exclusive"
readiness_probe = "environment/validate_environment.ps1"
timeout_policy = "task.toml:timeout_seconds"
cleanup_policy = "environment/cleanup.ps1 plus evaluator temporary-root cleanup"
prepare = "environment/prepare.ps1"
start = "environment/run.ps1"
exec_agent = "workspace/run.ps1"
test = "tests/run_tests.ps1"
collect = "results/"
cleanup = "environment/cleanup.ps1"
restore = "environment/restore.ps1"
snapshot = "NOT_USED_LOCAL_WINDOWS_PILOT"
