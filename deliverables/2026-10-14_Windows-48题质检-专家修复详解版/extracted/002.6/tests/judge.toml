schema_version = "outside-six-programmatic-rubric-v1"
authoritative_source = "rubric.json"
source_sha256 = "0d5e96739c1f42155e9a9db56ad5fa1e30bb9dca03953b6d0532f2b1b2c75b80"
scoring_note = "No weights and no partial credit: the score is binary over the fixed required testcase set. Reward 1 only when every required F2P/P2P was really collected, executed and passed; any failure, skip, error or missing testcase is 0/INVALID. The per-item mapping below is reporting metadata only and does not weight the score."

[[rubrics]]
rubric_id = "batch-transaction"
description = "Implements atomic preflight and commit semantics so an invalid batch or audit target cannot cause partial file mutation, while a valid batch commits in order."
type = "programmatic"
test_ids = ["F2P-16-atomic-preflight", "F2P-17-atomic-no-partial-mutation", "F2P-18-atomic-commit-order", "F2P-20-audit-preflight", "F2P-21-locked-audit-no-mutation", "F2P-22-atomic-delete-failure", "F2P-24-audit-target-ads-rejected", "F2P-25-audit-target-wildcard-rejected"]
pass_condition = "All atomic cancellation, no-partial-mutation, commit-order, and audit-preflight checks pass."
failure_reason = "The implementation mutates files before completing preflight, mishandles atomic commit order, or permits an invalid audit target to reach mutation."

[[rubrics]]
rubric_id = "whatif-preview"
description = "Provides a non-mutating WhatIf preview that distinguishes a marked file from an already-clean file and does not create audit output."
type = "programmatic"
test_ids = ["F2P-14-whatif-status", "F2P-15-whatif-no-mutation", "F2P-27-atomic-whatif-preview", "F2P-28-whatif-input-states"]
pass_condition = "Both WhatIf status and no-mutation checks pass."
failure_reason = "Preview mode performs the removal, creates audit output, or reports the wrong state."

[[rubrics]]
rubric_id = "ads-removal"
description = "Removes exactly the Zone.Identifier stream, matches its name case-insensitively, and reports Removed for a marked regular file."
type = "programmatic"
test_ids = ["F2P-01-result-removed", "F2P-02-zone-stream-removed", "F2P-10-case-insensitive-zone"]
pass_condition = "All three stream-removal checks pass."
failure_reason = "The source mark remains, the case variant is missed, or the status does not describe actual removal."

[[rubrics]]
rubric_id = "state-preservation"
description = "Preserves the same primary file object, its bytes and timestamps, and unrelated alternate data streams, including for protected files."
type = "programmatic"
test_ids = ["F2P-03-main-content", "F2P-04-other-streams", "F2P-05-attributes-preserved", "F2P-06-readonly-removed", "F2P-07-readonly-attributes", "F2P-08-readonly-content", "F2P-09-readonly-other-stream", "F2P-11-file-identity", "F2P-12-timestamps-preserved", "F2P-13-readonly-timestamps"]
requires_test_ids = ["F2P-02-zone-stream-removed"]
pass_condition = "The target ADS is removed and all identity, content, timestamp, attribute, read-only, and unrelated-stream checks pass."
failure_reason = "The primary file was replaced or changed, timestamps or attributes were lost, or an unrelated stream was modified."

[[rubrics]]
rubric_id = "safe-inputs"
description = "Processes a batch independently and rejects missing, directory, wildcard, ADS, and reparse-point inputs without modifying rejected data."
type = "programmatic"
test_ids = ["PASS-02-mixed-continuation", "PASS-03-invalid-inputs", "PASS-05-ads-input-rejected", "PASS-06-reparse-rejected"]
pass_condition = "All invalid-input and continuation checks pass."
failure_reason = "A bad input aborts later work, wildcard semantics leak into the API, or a non-regular input is treated as a file."

[[rubrics]]
rubric_id = "audit-contract"
description = "Writes parseable ordered JSONL audit entries that agree with returned path and status values, while retaining idempotent result behavior."
type = "programmatic"
test_ids = ["F2P-19-atomic-audit", "PASS-01-clean-idempotent", "PASS-04-duplicate-order", "PASS-07-result-contract", "PASS-08-relative-path-echo", "PASS-09-atomic-duplicate-order", "F2P-23-audit-appends-per-call", "F2P-26-mixed-audit-order"]
pass_condition = "Audit, repeatability, duplicate ordering, and result-contract checks pass."
failure_reason = "Audit lines are missing or out of order, repeat calls are not state-aware, or result fields violate the contract."
scoring_rule = "binary_all_required"

[[rubrics]]
rubric_id = "audit-append-and-order"
description = "Appends one ordered JSONL audit line per input, including Failed entries, without truncating earlier evidence."
type = "programmatic"
test_ids = ["F2P-23-audit-appends-per-call", "F2P-26-mixed-audit-order"]
pass_condition = "Appended audit evidence keeps one ordered line per input for both successful and failed entries."
failure_reason = "Audit output is truncated on a repeat call, drops Failed entries, or reorders them against the results."

[[rubrics]]
rubric_id = "path-and-identity-exactness"
description = "Decides validity and audit-target conflicts from the real file identity and the whole parent chain, not from the leaf path string."
type = "programmatic"
test_ids = ["F2P-29-parent-reparse-rejected", "F2P-30-audit-parent-reparse-rejected", "F2P-31-audit-input-identity-collision", "F2P-32-hardlink-duplicate-identity"]
pass_condition = "A path reached through a reparse-point parent is rejected, an AuditPath that is the same file object as an input fails before any deletion, and a hard-link duplicate is reported by file identity."
failure_reason = "Only the leaf is reparse-checked, the audit target is compared as a path string, or hard links to the same file are treated as unrelated or as a failure."

[[rubrics]]
rubric_id = "audit-target-writability-cross-identity"
description = "Validates the audit target as writable before any deletion and lets a junction-parent path invalidate a batch."
type = "programmatic"
test_ids = ["F2P-33-audit-parent-deny-write", "F2P-34-cross-identity-junction-batch"]
pass_condition = "An unwritable audit parent fails before deletion, and a hard-link plus junction-parent batch cancels atomically."
failure_reason = "Deletion precedes the audit writability check, or a junction-parent entry is accepted via a valid hard link to the same file."

[[rubrics]]
rubric_id = "rollback-report"
description = "Confirms the outcome of a failed atomic rollback per file and names the files whose target stream could not be restored."
type = "programmatic"
test_ids = ["F2P-35-rollback-report"]
pass_condition = "The batch fails as a whole, the file whose removal never succeeded keeps every stream and byte, and a file whose stream could not be written back is named in the reported error."
failure_reason = "A rollback failure is swallowed, or an unrestorable file is reported as restored or not identified at all."

[[rubrics]]
rubric_id = "extended-length-spelling"
description = "Accepts extended-length spellings for input paths and -AuditPath, echoes them verbatim, and keeps the parent-chain, identity and audit-conflict decisions identical to the plain spelling."
type = "programmatic"
test_ids = ["F2P-36-extended-prefix-consistency"]
pass_condition = "A prefixed input is cleaned with a verbatim echo, a valid prefixed audit path is accepted, and a prefixed input still detects an audit target that is the same file object."
failure_reason = "The prefix is treated as part of the file name, the drive colon is mistaken for a stream separator, or a prefixed spelling weakens the identity checks."

[[rubrics]]
rubric_id = "metadata-preservation"
description = "Leaves every piece of metadata other than the target stream untouched: compression attribute, ACL and owner survive the clean."
type = "programmatic"
test_ids = ["F2P-37-compression-acl-owner-preserved"]
pass_condition = "A compressed file carrying an extra access-control entry is still cleaned and keeps its compressed attribute, ACL descriptor, owner and unrelated stream bytes."
failure_reason = "The compression attribute is lost, the ACL or owner changes, or the clean only works by rebuilding the file."
